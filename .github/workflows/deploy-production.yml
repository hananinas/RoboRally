name: Deploy production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: robo-rally-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted]
    environment: production

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Build production
        run: |
          nix build .#production \
            --impure \
            --no-update-lock-file \
            --print-build-logs

      - name: Deploy production
        env:
          SECRETS_COOKIE_0: ${{ secrets.KRATOS_SECRETS_COOKIE }}
          SECRETS_CIPHER_0: ${{ secrets.KRATOS_SECRETS_CIPHER }}
          SECRETS_SYSTEM: ${{ secrets.HYDRA_SECRETS_SYSTEM }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.KRATOS_HYDRA_UI_COOKIE_SECRET }}
          CSRF_COOKIE_SECRET: ${{ secrets.KRATOS_HYDRA_UI_CSRF_COOKIE_SECRET }}
        run: |
          release=$(readlink -e result)

          sudo -n /nix/var/nix/profiles/robo-rally-tools/bin/deploy-robo-rally "$release" <<EOF
          PC_PORT=18080
          WEB_SCHEME=https
          WEB_PORT=443
          WEB_HOST=se2-c.compute.dtu.dk
          SECRETS_COOKIE_0=$SECRETS_COOKIE_0
          SECRETS_CIPHER_0=$SECRETS_CIPHER_0
          SECRETS_SYSTEM=$SECRETS_SYSTEM
          OAUTH_CLIENT_SECRET=$OAUTH_CLIENT_SECRET
          COOKIE_SECRET=$COOKIE_SECRET
          CSRF_COOKIE_SECRET=$CSRF_COOKIE_SECRET
          EOF
