name: PR tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: [self-hosted]
    timeout-minutes: 15
    env:
      CI: true

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.check }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, build, test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ${{ matrix.check }}
        run: |
          nix build ".#checks.x86_64-linux.${{ matrix.check }}" \
            --no-update-lock-file \
            --print-build-logs
