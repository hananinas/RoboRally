asyncapi: 3.1.0

info:
  title: Game Service 
  version: 0.0.0
  description: |
    Server API. Each Socket.IO event carries one JSON payload.
    Message name = Socket.IO event name.
    Room channel address = server broadcast destination.
    Commands are emitted directly to the server.
defaultContentType: application/json


channels:
  commands:
    address: commands
    description: inbound channel for messages/events emitted by the client; not a Socket.IO room.
    x-socketio:
      routing: client-to-server
    messages:
      submitProgram:
        $ref: '#/components/messages/SubmitProgram'

  programReplies:
    address: null
    description: |
      Logical reply channel, not a Socket.IO room. 
      Delivered through the acknowledgement callback of program.submit.
    messages:
      programResult:
        $ref: '#/components/messages/ProgramResult'

  player:
    address: 'game:{gameId}:player:{playerId}'
    parameters:
      gameId:
        description: Game identifier
      playerId:
        description: Player identifier
    messages:
      cardsDealt:
        $ref: '#/components/messages/CardsDealt'

  public:
    address: 'game:{gameId}:public'
    parameters:
      gameId:
        description: Game identifier
    messages:
      programSubmitted:
        $ref: '#/components/messages/ProgramSubmitted'
      robotActionResolved:
        $ref: '#/components/messages/RobotActionResolved'

  lobby:
    address: 'game:{gameId}:lobby'
    parameters:
      gameId:
        description: Game identifier

operations:
  receiveProgram:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/submitProgram'
    reply:
      channel:
        $ref: '#/channels/programReplies'
      messages:
        - $ref: '#/channels/programReplies/messages/programResult'
      x-socketio:
        acknowledgement: true

  sendPrivateEvents:
    action: send
    channel:
      $ref: '#/channels/player'

  broadcastGameEvents:
    action: send
    channel:
      $ref: '#/channels/public'

components:
  messages:
    SubmitProgram:
      name: program.submit
      payload:
        type: object
        additionalProperties: false
        required: [gameId, cardIds]
        properties:
          gameId:
            type: string
            format: uuid
          cardIds:
            type: array
            description: Card instance IDs in register order.
            minItems: 5
            maxItems: 5
            uniqueItems: true
            items:
              type: string
              format: uuid

    CardsDealt:
      name: cards.dealt
      payload:
        type: object
        required: [gameId, cards]
        properties:
          gameId:
            type: string
            format: uuid
          cards:
            type: array
            items:
              $ref: '#/components/schemas/Card'

    ProgramResult:
      name: program.result
      payload:
        type: object
        required: [gameId, outcome]
        properties:
          gameId:
            type: string
            format: uuid
          outcome:
            type: string
            enum:
              - ACCEPTED
              - INVALID_PROGRAM

    ProgramSubmitted:
      name: program.submitted
      description: Reveals readiness, never the submitted cards.
      payload:
        type: object
        required: [gameId, playerId]
        properties:
          gameId:
            type: string
          playerId:
            type: string

    RobotActionResolved:
      name: robot.actionResolved
      payload:
        type: object
        required:
          - gameId
          - robotId
          - instruction
          - position
        properties:
          gameId:
            type: string
            format: uuid
          robotId:
            type: string
            format: uuid
          instruction:
            $ref: '#/components/schemas/Instruction'
          position:
            $ref: '#/components/schemas/RobotPosition'

  schemas:
    Instruction:
      type: string
      enum: [MOVE_1, TURN_90]

    Card:
      type: object
      required: [id, instruction]
      properties:
        id:
          type: string
          format: uuid
          description: Unique card instance ID
        instruction:
          $ref: '#/components/schemas/Instruction'

    RobotPosition:
      type: object
      description: |
        Authoritative state after the instruction.
      required: [x, y, orientation]
      properties:
        x:
          type: integer
        y:
          type: integer
        orientation:
          type: string
          enum: [NORTH, EAST, SOUTH, WEST]
