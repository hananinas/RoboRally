asyncapi: 3.1.0

info:
  title: Game Service
  version: 0.5.0-draft
  description: |-
    v0.5 contract draft for review. Login, joining, membership, and multiplayer
    phase payloads are specified; runtime implementation still follows separately.
    See v05Communication.md for the flow and v05Rounds.md for progression rules.
    Each Socket.IO event carries one JSON payload. Message name = event name.
    Room channel address = server broadcast destination. Commands go directly to
    the service; results use acknowledgement callbacks, not separate reply events.
defaultContentType: application/json

channels:
  commands:
    address: commands
    description: inbound channel for messages/events emitted by the client; not a Socket.IO room.
    x-socketio:
      routing: client-to-server
    messages:
      login:
        $ref: '#/components/messages/Login'
      joinGame:
        $ref: '#/components/messages/JoinGame'
      leaveGame:
        $ref: '#/components/messages/LeaveGame'
      submitProgram:
        $ref: '#/components/messages/SubmitProgram'
      getPublicGameState:
        $ref: '#/components/messages/GetPublicGameState'

  loginReplies:
    address: null
    description: Logical reply channel; delivered through the user.login acknowledgement.
    messages:
      result:
        $ref: '#/components/messages/LoginResult'

  joinReplies:
    address: null
    description: Logical reply channel; delivered through the game.join acknowledgement.
    messages:
      result:
        $ref: '#/components/messages/JoinResult'

  leaveReplies:
    address: null
    description: Logical reply channel; delivered through the game.leave acknowledgement.
    messages:
      result:
        $ref: '#/components/messages/LeaveResult'

  programReplies:
    address: null
    description: |
      Logical reply channel, not a Socket.IO room.
      Delivered through the acknowledgement callback of program.submit.
    messages:
      programResult:
        $ref: '#/components/messages/ProgramResult'

  publicGameStateReplies:
    address: null
    description: |
      Logical reply channel, not a Socket.IO room.
      Delivered through the acknowledgement callback of game.getPublicGameState
    messages:
      publicGameStateResult:
        $ref: '#/components/messages/PublicGameStateResult'

  player:
    address: 'game:{gameId}:player:{playerId}'
    parameters:
      gameId:
        description: Game identifier
      playerId:
        description: Player identifier
    messages:
      cardsDealt:
        $ref: '#/components/messages/CardsDealt'

  public:
    address: 'game:{gameId}:public'
    parameters:
      gameId:
        description: Game identifier
    messages:
      programSubmitted:
        $ref: '#/components/messages/ProgramSubmitted'
      robotActionResolved:
        $ref: '#/components/messages/RobotActionResolved'
      playerJoined:
        $ref: '#/components/messages/PlayerJoined'
      playerLeft:
        $ref: '#/components/messages/PlayerLeft'
      phaseChanged:
        $ref: '#/components/messages/PhaseChanged'

operations:
  handleLogin:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/login'
    reply:
      channel:
        $ref: '#/channels/loginReplies'
      messages:
        - $ref: '#/channels/loginReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleJoinGame:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/joinGame'
    reply:
      channel:
        $ref: '#/channels/joinReplies'
      messages:
        - $ref: '#/channels/joinReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleLeaveGame:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/leaveGame'
    reply:
      channel:
        $ref: '#/channels/leaveReplies'
      messages:
        - $ref: '#/channels/leaveReplies/messages/result'
      x-socketio:
        acknowledgement: true

  receiveProgram:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/submitProgram'
    reply:
      channel:
        $ref: '#/channels/programReplies'
      messages:
        - $ref: '#/channels/programReplies/messages/programResult'
      x-socketio:
        acknowledgement: true

  sendPrivateEvents:
    action: send
    channel:
      $ref: '#/channels/player'

  broadcastGameEvents:
    action: send
    channel:
      $ref: '#/channels/public'

  handleGetGameState:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/getPublicGameState'
    reply:
      channel:
        $ref: '#/channels/publicGameStateReplies'
      messages:
        - $ref: '#/channels/publicGameStateReplies/messages/publicGameStateResult'
      x-socketio:
        acknowledgement: true

components:
  messages:

    # Login
    Login:
      name: user.login
      description: |
        Find or create a user from a username; never create game participation.
        Multiple connections may log in as the same user. Exclusivity is checked
        only when joining the same game, not during login.
      payload:
        $ref: '#/components/schemas/Login'

      examples:
        - name: "username"
          summary: "Exact username, no normalization"
          payload:
            username: "Dane"

    LoginResult:
      name: user.loginResult
      description: Acknowledgement only. Return approved user identity or a rejection; never player or robot.
      payload:
        $ref: '#/components/schemas/LoginResult'

      examples:
        - name: "loggedIn"
          summary: "Same shape for new and existing users"
          payload:
            outcome: "LOGGED_IN"
            user:
              userId: "00000000-0000-4000-8000-000000000004"
              username: "Dane"
        - name: "invalidUsername"
          summary: "Empty or overlong username"
          payload:
            outcome: "INVALID_USERNAME"

    # Membership
    JoinGame:
      name: game.join
      description: |
        Join the configured game using the approved connection identity.
        Reject USER_ALREADY_IN_GAME when another connection owns this user's
        membership in this game. Reserve/check membership atomically, including
        simultaneous joins. There is no separate lobby step in v0.5.
        During EXECUTING, place the new robot but exclude it from the current
        activation; return an empty hand and programSubmitted false. At the next
        PROGRAMMING phase it receives cards.dealt and counts toward submission.
      payload:
        $ref: '#/components/schemas/JoinGame'

      examples:
        - name: "join"
          summary: "Configured shared game"
          payload:
            gameId: "00000000-0000-4000-8000-000000000001"

    JoinResult:
      name: game.joinResult
      description: >-
        Acknowledgement only. Return assignment, initial state, private hand, and submission status
        together, or a rejection.
      payload:
        $ref: '#/components/schemas/JoinResult'

      examples:
        - name: joinedProgramming
          summary: One-tile illustrative board; normal initial hand
          payload:
            outcome: JOINED
            assignment:
              gameId: 00000000-0000-4000-8000-000000000001
              playerId: 00000000-0000-4000-8000-000000000002
              robotId: 00000000-0000-4000-8000-000000000003
            state:
              gameId: 00000000-0000-4000-8000-000000000001
              board:
                width: 1
                height: 1
                tiles:
                  - position:
                      x: 0
                      y: 0
                    type: EMPTY
              robots:
                - robotId: 00000000-0000-4000-8000-000000000003
                  playerId: 00000000-0000-4000-8000-000000000002
                  position:
                    coordinate:
                      x: 0
                      y: 0
                    orientation: NORTH
              phase: PROGRAMMING
              roundNumber: 1
              antenna:
                x: 0
                y: 0
                angle: 1.5707963267948966
              players:
                - playerId: 00000000-0000-4000-8000-000000000002
                  username: Dane
                  programSubmitted: false
                  participatesInRound: true
            hand:
              - id: 00000000-0000-4000-8000-000000000101
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000102
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000103
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000104
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000105
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000106
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000107
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000108
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000109
                instruction: MOVE_1
            programSubmitted: false
        - name: joinedActivation
          summary: New player sits out activation and waits for cards
          payload:
            outcome: JOINED
            assignment:
              gameId: 00000000-0000-4000-8000-000000000001
              playerId: 00000000-0000-4000-8000-000000000002
              robotId: 00000000-0000-4000-8000-000000000003
            state:
              gameId: 00000000-0000-4000-8000-000000000001
              board:
                width: 1
                height: 1
                tiles:
                  - position:
                      x: 0
                      y: 0
                    type: EMPTY
              robots:
                - robotId: 00000000-0000-4000-8000-000000000003
                  playerId: 00000000-0000-4000-8000-000000000002
                  position:
                    coordinate:
                      x: 0
                      y: 0
                    orientation: NORTH
              phase: EXECUTING
              roundNumber: 1
              antenna:
                x: 0
                y: 0
                angle: 1.5707963267948966
              players:
                - playerId: 00000000-0000-4000-8000-000000000002
                  username: Dane
                  programSubmitted: false
                  participatesInRound: false
            hand: []
            programSubmitted: false
        - name: duplicateUser
          summary: Another connection already owns membership
          payload:
            outcome: USER_ALREADY_IN_GAME
        - name: spawnUnavailable
          summary: No partial membership was created
          payload:
            outcome: NO_SPAWN_AVAILABLE

    LeaveGame:
      name: game.leave
      description: >-
        Remove only the requesting connection's membership/robot/program and private/public room
        subscriptions, while preserving login. Acknowledge LEFT before notifying remaining clients.
        Recheck progression after the removal event. Disconnect uses the same removal path without
        an acknowledgement and releases membership immediately when the service detects it.
      payload:
        $ref: '#/components/schemas/LeaveGame'
      examples:
        - name: leave
          payload:
            gameId: 00000000-0000-4000-8000-000000000001

    LeaveResult:
      name: game.leaveResult
      description: >-
        Acknowledgement only. Explicit leave preserves login. Repeating leave is safe and cannot
        remove another connection's membership.
      payload:
        $ref: '#/components/schemas/LeaveResult'
      examples:
        - name: left
          payload:
            outcome: LEFT
            gameId: 00000000-0000-4000-8000-000000000001

    PlayerJoined:
      name: game.playerJoined
      description: >-
        New participant and robot for existing clients; includes current-round eligibility and
        submission status, never the hand.
      payload:
        $ref: '#/components/schemas/PlayerJoined'
      examples:
        - name: joinDuringActivation
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            player:
              playerId: 00000000-0000-4000-8000-000000000002
              username: Dane
              programSubmitted: false
              participatesInRound: false
            robot:
              robotId: 00000000-0000-4000-8000-000000000003
              playerId: 00000000-0000-4000-8000-000000000002
              position:
                coordinate:
                  x: 0
                  y: 0
                orientation: NORTH

    PlayerLeft:
      name: game.playerLeft
      description: >-
        Removal after explicit leave or detected disconnect. Emit once to remaining clients before
        any phase transition the removal triggers.
      payload:
        $ref: '#/components/schemas/PlayerLeft'
      examples:
        - name: disconnect
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            playerId: 00000000-0000-4000-8000-000000000002
            robotId: 00000000-0000-4000-8000-000000000003
            reason: DISCONNECTED

    # Snapshots
    GetPublicGameState:
      name: game.getPublicGameState
      payload:
        type: object
        additionalProperties: false
        required: [ gameId ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
      description: |-
        Only the connection that successfully joined the requested game may read its snapshot.
        Login alone, including the same username on another connection, grants no access.
        Check the service's current connection-to-game membership, not client-supplied identity.
        Leaving or disconnecting removes access. Reading never joins or subscribes the caller.
        Return GAME_NOT_FOUND without state for unknown games, nonmembers, or malformed requests,
        retaining the existing non-disclosing rejection shape. The first snapshot is supplied
        by successful game.join after membership is established.

    PublicGameStateResult:
      name: game.publicGameStateResult
      description: >-
        Acknowledgement for game.getPublicGameState. GAME_FOUND is available only to the requesting
        connection's current game membership; GAME_NOT_FOUND means no accessible game and contains
        no state.
      payload:
        oneOf:
          - $ref: '#/components/schemas/PublicGameStateFound'
          - $ref: '#/components/schemas/PublicGameStateNotFound'
      examples:
        - name: memberSnapshot
          summary: Joined connection reads its game
          payload:
            outcome: GAME_FOUND
            state:
              gameId: 00000000-0000-4000-8000-000000000001
              board:
                width: 1
                height: 1
                tiles:
                  - position:
                      x: 0
                      y: 0
                    type: EMPTY
              robots:
                - robotId: 00000000-0000-4000-8000-000000000003
                  playerId: 00000000-0000-4000-8000-000000000002
                  position:
                    coordinate:
                      x: 0
                      y: 0
                    orientation: NORTH
              phase: PROGRAMMING
              roundNumber: 1
              antenna:
                x: 0
                y: 0
                angle: 1.5707963267948966
              players:
                - playerId: 00000000-0000-4000-8000-000000000002
                  username: Dane
                  programSubmitted: false
                  participatesInRound: true
        - name: nonmember
          summary: Before joining, after leaving, or a different connection using the same username
          payload:
            outcome: GAME_NOT_FOUND

    # Rounds
    SubmitProgram:
      name: program.submit
      payload:
        type: object
        additionalProperties: false
        required:
          - gameId
          - playerId
          - cardIds
          - roundNumber
        properties:
          gameId:
            $ref: "#/components/schemas/GameId"
          playerId:
            $ref: "#/components/schemas/PlayerId"
          cardIds:
            type: array
            description: Card instance IDs in register order.
            minItems: 5
            maxItems: 5
            uniqueItems: true
            items:
              $ref: "#/components/schemas/CardId"
          roundNumber:
            $ref: "#/components/schemas/RoundNumber"
      description: >-
        Submit once per round during PROGRAMMING. The round number must equal the current game
        round. Accept only the connection-owned player and five distinct cards from their hand;
        rejection changes nothing.
      examples:
        - name: submit
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            playerId: 00000000-0000-4000-8000-000000000002
            cardIds:
              - 00000000-0000-4000-8000-000000000101
              - 00000000-0000-4000-8000-000000000102
              - 00000000-0000-4000-8000-000000000103
              - 00000000-0000-4000-8000-000000000104
              - 00000000-0000-4000-8000-000000000105

    ProgramResult:
      name: program.result
      payload:
        type: object
        required: [ outcome ]
        properties:
          outcome:
            type: string
            enum:
              - ACCEPTED
              - INVALID_PROGRAM
      description: >-
        Acknowledgement before shared submission/phase events. INVALID_PROGRAM also covers stale
        round, duplicate, wrong phase/ownership, malformed input, and invalid cards; no game state
        changes.

    ProgramSubmitted:
      name: program.submitted
      description: >-
        After acknowledging ACCEPTED, broadcast to all current game connections including the
        submitter; set this player's submission flag. Never disclose cards. The last notification
        precedes EXECUTING.
      payload:
        type: object
        required:
          - playerId
          - gameId
          - roundNumber
        properties:
          playerId:
            $ref: "#/components/schemas/PlayerId"
          gameId:
            $ref: "#/components/schemas/GameId"
          roundNumber:
            $ref: "#/components/schemas/RoundNumber"
      examples:
        - name: ready
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            playerId: 00000000-0000-4000-8000-000000000002

    PhaseChanged:
      name: game.phaseChanged
      description: >-
        Authoritative round/phase transition, broadcast to every current game connection. Clients
        queue it after earlier action results.
      payload:
        $ref: '#/components/schemas/PhaseChanged'
      examples:
        - name: startActivation
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            phase: EXECUTING
        - name: nextProgramming
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 2
            phase: PROGRAMMING

    RobotActionResolved:
      name: robot.actionResolved
      payload:
        type: object
        required:
          - robotId
          - instruction
          - position
          - gameId
          - roundNumber
          - registerIndex
        properties:
          robotId:
            $ref: "#/components/schemas/RobotId"
          instruction:
            $ref: "#/components/schemas/Instruction"
          position:
            $ref: "#/components/schemas/Position"
          gameId:
            $ref: "#/components/schemas/GameId"
          roundNumber:
            $ref: "#/components/schemas/RoundNumber"
          registerIndex:
            type: integer
            minimum: 0
            maximum: 4
            description: Zero-based register index; display 1–5. Multiple robot actions can share one index.
      description: >-
        One result per eligible robot per register, including blocked moves. Broadcast immediately
        to all joined clients. Ordered by register then recalculated antenna priority; clients
        preserve every result in playback. Use game/round IDs to ignore stale results; do not wait
        for animation acknowledgements.
      examples:
        - name: firstRegister
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            registerIndex: 0
            robotId: 00000000-0000-4000-8000-000000000003
            instruction: MOVE_1
            position:
              coordinate:
                x: 10
                y: 6
              orientation: NORTH

    CardsDealt:
      name: cards.dealt
      payload:
        type: object
        required:
          - cards
          - gameId
          - roundNumber
          - playerId
        properties:
          cards:
            type: array
            items:
              $ref: "#/components/schemas/Card"
          gameId:
            $ref: "#/components/schemas/GameId"
          roundNumber:
            $ref: "#/components/schemas/RoundNumber"
          playerId:
            $ref: "#/components/schemas/PlayerId"
      description: >-
        Private hand for the named player and round, sent after PROGRAMMING. Initial hand arrives in
        JOINED, not a second event. A late-activation join receives its first cards here. Ignore an
        old round or a different assignment.
      examples:
        - name: nextHand
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 2
            playerId: 00000000-0000-4000-8000-000000000002
            cards:
              - id: 00000000-0000-4000-8000-000000000101
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000102
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000103
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000104
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000105
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000106
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000107
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000108
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000109
                instruction: MOVE_1

  schemas:

    # Login
    Username:
      type: string
      minLength: 1
      maxLength: 30
      description: |
        Count Unicode code points (Array.from(username).length in JavaScript), not
        UTF-16 code units. Preserve the exact string, including whitespace and case;
        no trimming, case folding, or Unicode normalization. Extra request properties
        are rejected separately as INVALID_REQUEST.

    User:
      type: object
      additionalProperties: false
      required: [ userId, username ]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        username:
          $ref: '#/components/schemas/Username'

    Login:
      type: object
      additionalProperties: false
      required: [ username ]
      properties:
        username:
          $ref: '#/components/schemas/Username'

    LoginResult:
      oneOf:
        - $ref: '#/components/schemas/LoginAccepted'
        - $ref: '#/components/schemas/LoginRejected'

    LoginAccepted:
      type: object
      additionalProperties: false
      required: [ outcome, user ]
      properties:
        outcome:
          type: string
          enum: [ LOGGED_IN ]
        user:
          $ref: '#/components/schemas/User'

    LoginRejected:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ INVALID_USERNAME, INVALID_REQUEST, ALREADY_LOGGED_IN, INTERNAL_ERROR ]
      description: |
        INVALID_USERNAME covers a missing/non-string username or a length outside 1–30.
        INVALID_REQUEST covers a non-object request or additional properties.
        ALREADY_LOGGED_IN means this connection is bound to a different username.
        Repeating login with the same username returns LOGGED_IN with the same user.
        INTERNAL_ERROR is an unexpected service failure; do not expose internals.

    # Membership
    JoinGame:
      type: object
      additionalProperties: false
      required: [ gameId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'

    PlayerAssignment:
      type: object
      additionalProperties: false
      required: [ gameId, playerId, robotId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        robotId:
          $ref: '#/components/schemas/RobotId'

    JoinResult:
      oneOf:
        - $ref: '#/components/schemas/JoinAccepted'
        - $ref: '#/components/schemas/JoinRejected'

    JoinAccepted:
      type: object
      additionalProperties: false
      required:
        - outcome
        - assignment
        - state
        - hand
        - programSubmitted
      properties:
        outcome:
          type: string
          enum:
            - JOINED
        assignment:
          $ref: "#/components/schemas/PlayerAssignment"
        state:
          $ref: "#/components/schemas/PublicGameState"
        hand:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: >-
            Empty for a new player joining during EXECUTING; their first hand arrives via
            cards.dealt at the next PROGRAMMING phase.
        programSubmitted:
          type: boolean
          description: >-
            Whether this player has already submitted for the current round. Locks duplicate
            submission on repeated joins.
      description: |-
        assignment.gameId equals the requested game and state.gameId. state.robots
        contains assignment.robotId owned by assignment.playerId. The hand is private
        to this assignment. Apply this result atomically before processing later events.
        A new join during PROGRAMMING receives the normal initial hand and counts
        toward this round's submissions immediately. A new join during EXECUTING
        has hand [] and programSubmitted false; participation starts next round.
        Repeated joins by the owning connection preserve the actual current hand
        and submission status, rather than resetting an existing player's program.
         state.players contains the assigned player; its programSubmitted value equals the private top-level field. A new activation-time join has participatesInRound false. The snapshot is not a replay; show current positions and process only later actions.

    JoinRejected:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum:
            [
              LOGIN_REQUIRED,
              INVALID_REQUEST,
              GAME_NOT_FOUND,
              NO_SPAWN_AVAILABLE,
              USER_ALREADY_IN_GAME,
              ALREADY_IN_GAME,
              INTERNAL_ERROR
            ]
      description: |
        LOGIN_REQUIRED means no approved identity on this connection.
        INVALID_REQUEST covers malformed payloads, invalid game UUIDs, or extra properties.
        GAME_NOT_FOUND means the configured game is unavailable.
        NO_SPAWN_AVAILABLE means no valid centre-then-left position remains; no partial
        membership or robot is created. There is no configured player cap.
        USER_ALREADY_IN_GAME means another connection already owns this user's
        membership in the requested game. Login remains valid; retry after that
        membership is released. Duplicate-user rejection belongs here, not in login.
        ALREADY_IN_GAME means this connection belongs to a different game.
        Repeating a join for the same game returns the existing assignment and a fresh
        snapshot/hand/submission status, without creating another robot or notification.
        Rejections retain login. INTERNAL_ERROR must leave no partial assignment.

    LeaveGame:
      type: object
      additionalProperties: false
      required: [ gameId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'

    LeaveResult:
      oneOf:
        - $ref: "#/components/schemas/LeaveAccepted"
        - $ref: "#/components/schemas/LeaveRejected"
    LeaveAccepted:
      type: object
      additionalProperties: false
      required:
        - outcome
        - gameId
      properties:
        outcome:
          type: string
          enum:
            - LEFT
        gameId:
          $ref: "#/components/schemas/GameId"
      description: >-
        The connection no longer participates in this game. Keep its approved login. Repeating leave
        on a known game returns LEFT without another removal event; never remove membership owned by
        another connection.
    LeaveRejected:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - LOGIN_REQUIRED
            - INVALID_REQUEST
            - GAME_NOT_FOUND
            - INTERNAL_ERROR
      description: >-
        Malformed/unknown/unauthenticated requests change nothing. Reuse login/join rejection
        meanings. Unexpected failures must not leave partially removed membership.
    PlayerState:
      type: object
      additionalProperties: false
      required:
        - playerId
        - username
        - programSubmitted
        - participatesInRound
      properties:
        playerId:
          $ref: "#/components/schemas/PlayerId"
        username:
          $ref: "#/components/schemas/Username"
        programSubmitted:
          type: boolean
        participatesInRound:
          type: boolean
      description: >-
        Public readiness only; never cards. A player joining during EXECUTING has both flags false.
        At the next PROGRAMMING phase all current players participate and all submission flags
        reset.

    PlayerJoined:
      type: object
      additionalProperties: false
      required:
        - gameId
        - roundNumber
        - player
        - robot
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        roundNumber:
          $ref: "#/components/schemas/RoundNumber"
        player:
          $ref: "#/components/schemas/PlayerState"
        robot:
          $ref: "#/components/schemas/Robot"
      description: >-
        Send to existing game connections after the new connection receives JOINED. player.playerId
        equals robot.playerId. The snapshot already includes the joining player, so do not send them
        this event. Duplicate joins emit nothing.

    PlayerLeft:
      type: object
      additionalProperties: false
      required:
        - gameId
        - roundNumber
        - playerId
        - robotId
        - reason
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        roundNumber:
          $ref: "#/components/schemas/RoundNumber"
        playerId:
          $ref: "#/components/schemas/PlayerId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        reason:
          type: string
          enum:
            - LEFT
            - DISCONNECTED
      description: >-
        Broadcast to remaining game connections after atomic removal. roundNumber is the round the
        player left, before any resulting phase transition. Remove the player/robot from display and
        readiness. Process after earlier queued actions, not ahead of their playback.

    # Snapshots
    PublicGameState:
      description: >-
        Authoritative snapshot at the join/read boundary. Player flags, robots, phase, round, and
        antenna describe the same instant. Each player maps to exactly one robot via robot.playerId.
        Private hand/submission fields in JOINED agree with that player entry.
      type: object
      required:
        - gameId
        - roundNumber
        - board
        - antenna
        - players
        - robots
        - phase
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        board:
          $ref: "#/components/schemas/Board"
        robots:
          type: array
          items:
            $ref: "#/components/schemas/Robot"
        phase:
          $ref: "#/components/schemas/GamePhase"
        roundNumber:
          $ref: "#/components/schemas/RoundNumber"
        antenna:
          $ref: "#/components/schemas/Antenna"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerState"

    PublicGameStateFound:
      type: object
      additionalProperties: false
      required: [ outcome, state ]
      properties:
        outcome:
          type: string
          enum: [ GAME_FOUND ]
        state:
          $ref: '#/components/schemas/PublicGameState'

    PublicGameStateNotFound:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ GAME_NOT_FOUND ]
      description: >-
        No accessible game: the game is unknown, the connection is not a member, or the request is
        malformed. Do not return state or reveal whether an inaccessible game exists.

    # Rounds
    RoundNumber:
      type: integer
      minimum: 1
      description: >-
        Starts at 1. Increment once when activation ends, including early completion because no
        eligible robots remain. Both phases of a round use that number. With no players, PROGRAMMING
        remains idle and never advances by itself.
    GamePhase:
      type: string
      enum:
        - PROGRAMMING
        - EXECUTING
      description: EXECUTING means domain activation. No lobby/WAITING phase.

    PhaseChanged:
      type: object
      additionalProperties: false
      required:
        - gameId
        - roundNumber
        - phase
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        roundNumber:
          $ref: "#/components/schemas/RoundNumber"
        phase:
          $ref: "#/components/schemas/GamePhase"
      description: >-
        Broadcast to every current game connection once per transition. EXECUTING keeps this round
        number and follows the final submission notification. PROGRAMMING increments the round,
        resets all submission flags, makes current players eligible, and precedes their private
        cards.dealt. Start activation only for a nonempty roster with every current player
        submitted. Removal during PROGRAMMING rechecks this condition. Removal during EXECUTING
        cancels only future actions for that robot. If no eligible robots remain, finish activation
        once and enter next-round PROGRAMMING; with no players, stay idle and deal to nobody.

    # Shared types
    UserId:
      type: string
      format: uuid
      description: >-
        Opaque service-issued user ID, separate from player and socket IDs. Storage lifetime is
        deferred to #65 and does not change the client flow.

    GameId:
      type: string
      format: uuid

    PlayerId:
      type: string
      format: uuid

    RobotId:
      type: string
      format: uuid

    CardId:
      type: string
      format: uuid

    Instruction:
      type: string
      enum: [ MOVE_1, TURN_LEFT ]

    Card:
      type: object
      required: [ id, instruction ]
      properties:
        id:
          $ref: '#/components/schemas/CardId'
          description: Unique card instance ID
        instruction:
          $ref: '#/components/schemas/Instruction'

    Orientation:
      type: string
      enum: [ NORTH, EAST, SOUTH, WEST ]

    Coordinate:
      type: object
      description: A board location without a facing direction.
      required: [ x, y ]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0

    Position:
      type: object
      required: [ coordinate, orientation ]
      properties:
        coordinate:
          $ref: '#/components/schemas/Coordinate'
        orientation:
          $ref: '#/components/schemas/Orientation'

    Robot:
      type: object
      required: [ robotId, playerId, position ]
      properties:
        robotId:
          $ref: '#/components/schemas/RobotId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        position:
          $ref: '#/components/schemas/Position'

    Board:
      type: object
      required: [ width, height, tiles ]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/Tile'

    Tile:
      type: object
      required: [ position, type ]
      properties:
        position:
          $ref: '#/components/schemas/Coordinate'
        type:
          type: string
          enum: [ EMPTY ]
        walls:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Orientation'
    Antenna:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - angle
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        angle:
          type: number
      description: >-
        Fixed game configuration. Coordinates must be on the board. Angle is radians clockwise from
        east (south is pi/2), matching the documented priority algorithm. Does not occupy a robot
        slot or add board effects. The current 21×15 test board uses x=10, y=0, angle=pi/2 (south).
        For other widths use floor(width/2), y=0, facing south; keep configuration fixed per game.
