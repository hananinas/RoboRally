asyncapi: 3.1.0

info:
  title: Game Service
  version: 0.5.0-draft
  description: |-
    This document describes RoboRally's client-server communication. No code change
    regarding communication should be made without updating this document.
    Server broadcast destinations represent Socket.IO rooms.
    Register and stat snapshots and broadcasts are restricted to the owning lobby's
    members, including recovered connections; lobby discovery never exposes them.
    Only the membership-owning connection receives its own hand in JOINED and
    cards.dealt. No payload delivered to another player may contain that hand.
    Public register slots contain no card instance IDs. HIDDEN slots contain only
    a face-down marker, never a card type or instruction; an instruction becomes
    public only when that owner's register executes.
    Public visibility grants no write access: the server checks connection-owned
    game/player membership and card ownership independently of displayed state.
    Snapshot creation and live-event delivery are ordered so no update is lost
    between JOINED and later events. After JOINED, do not replay events predating
    that snapshot. Successful recovery instead replays missed events in order
    against retained state.
defaultContentType: application/json

channels:
  commands:
    address: commands
    description: inbound channel for messages/events emitted by the client; not a Socket.IO room.
    x-socketio:
      routing: client-to-server
    messages:
      login:
        $ref: '#/components/messages/Login'
      joinGame:
        $ref: '#/components/messages/JoinGame'
      leaveGame:
        $ref: '#/components/messages/LeaveGame'
      submitProgram:
        $ref: '#/components/messages/SubmitProgram'
      updateRegisters:
        $ref: '#/components/messages/UpdateRegisters'
      getLobbyDetails:
        $ref: '#/components/messages/GetLobbyDetails'

  loginReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of user.login
    messages:
      result:
        $ref: '#/components/messages/LoginResult'

  joinReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of game.join
    messages:
      result:
        $ref: '#/components/messages/JoinResult'

  leaveReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of game.leave, not a separate event.
    messages:
      result:
        $ref: '#/components/messages/LeaveResult'

  programReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of program.submit
    messages:
      programResult:
        $ref: '#/components/messages/ProgramResult'

  registerUpdateReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of program.updateRegisters
    messages:
      result:
        $ref: '#/components/messages/RegisterUpdateResult'

  lobbyDetailsReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of game.getLobbyDetails
    messages:
      lobbyDetailsResult:
        $ref: '#/components/messages/LobbyDetailsResult'

  player:
    address: 'game:{gameId}:player:{playerId}'
    parameters:
      gameId:
        description: Game identifier
      playerId:
        description: Player identifier
    messages:
      cardsDealt:
        $ref: '#/components/messages/CardsDealt'

  public:
    address: 'game:{gameId}:public'
    parameters:
      gameId:
        description: Game identifier
    messages:
      programSubmitted:
        $ref: '#/components/messages/ProgramSubmitted'
      robotActionResolved:
        $ref: '#/components/messages/RobotActionResolved'
      playerCheckpointProgress:
        $ref: '#/components/messages/PlayerCheckpointProgress'
      playerJoined:
        $ref: '#/components/messages/PlayerJoined'
      playerLeft:
        $ref: '#/components/messages/PlayerLeft'
      playerConnectionChanged:
        $ref: '#/components/messages/PlayerConnectionChanged'
      gameAborted:
        $ref: '#/components/messages/GameAborted'
      playerStateChanged:
        $ref: '#/components/messages/PlayerStateChanged'
      programmingStarted:
        $ref: '#/components/messages/ProgrammingStarted'

operations:
  handleLogin:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/login'
    reply:
      channel:
        $ref: '#/channels/loginReplies'
      messages:
        - $ref: '#/channels/loginReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleJoinGame:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/joinGame'
    reply:
      channel:
        $ref: '#/channels/joinReplies'
      messages:
        - $ref: '#/channels/joinReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleLeaveGame:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/leaveGame'
    reply:
      channel:
        $ref: '#/channels/leaveReplies'
      messages:
        - $ref: '#/channels/leaveReplies/messages/result'
      x-socketio:
        acknowledgement: true

  receiveProgram:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/submitProgram'
    reply:
      channel:
        $ref: '#/channels/programReplies'
      messages:
        - $ref: '#/channels/programReplies/messages/programResult'
      x-socketio:
        acknowledgement: true

  sendPrivateEvents:
    action: send
    channel:
      $ref: '#/channels/player'

  broadcastGameEvents:
    action: send
    channel:
      $ref: '#/channels/public'

  handleGetLobbyDetails:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/getLobbyDetails'
    reply:
      channel:
        $ref: '#/channels/lobbyDetailsReplies'
      messages:
        - $ref: '#/channels/lobbyDetailsReplies/messages/lobbyDetailsResult'
      x-socketio:
        acknowledgement: true

  handleUpdateRegisters:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/updateRegisters'
    reply:
      channel:
        $ref: '#/channels/registerUpdateReplies'
      messages:
        - $ref: '#/channels/registerUpdateReplies/messages/result'
      x-socketio:
        acknowledgement: true

components:
  messages:

    Login:
      name: user.login
      description: Requests a user identity for a username.
      payload:
        $ref: '#/components/schemas/Login'

      examples:
        - name: "username"
          summary: "Exact username, no normalization"
          payload:
            username: "Dane"

    LoginResult:
      name: user.loginResult
      description: Returns an approved user identity or a rejection.
      payload:
        $ref: '#/components/schemas/LoginResult'

      examples:
        - name: "loggedIn"
          summary: "Same shape for new and existing users"
          payload:
            outcome: "LOGGED_IN"
            user:
              userId: "00000000-0000-4000-8000-000000000004"
              username: "Dane"
        - name: "invalidUsername"
          summary: "Empty or overlong username"
          payload:
            outcome: "INVALID_USERNAME"

    JoinGame:
      name: game.join
      description: |
        Joins the configured game or reconnects the logged-in user to their existing
        membership. New membership is rejected after the first program is accepted.
      payload:
        $ref: '#/components/schemas/JoinGame'

      examples:
        - name: "join"
          summary: "Configured shared game"
          payload:
            gameId: "00000000-0000-4000-8000-000000000001"

    JoinResult:
      name: game.joinResult
      description: >-
        Returns the player's assignment, every lobby member's public registers and
        stats in state.players, the requesting player's private hand, and submission
        status, or a rejection. Reconnecting uses this same response, preserving
        revealed instructions but hiding every unexecuted placed card. Apply the
        complete snapshot before later live events; replace, do not merge old rounds.
      payload:
        $ref: '#/components/schemas/JoinResult'

      examples:
        - name: joined
          summary: One-tile illustrative board; normal initial hand
          payload:
            outcome: JOINED
            assignment:
              gameId: 00000000-0000-4000-8000-000000000001
              playerId: 00000000-0000-4000-8000-000000000002
              robotId: 00000000-0000-4000-8000-000000000003
            state:
              gameId: 00000000-0000-4000-8000-000000000001
              checkpointCount: 0
              roundNumber: 1
              board:
                width: 1
                height: 1
                tiles:
                  - position:
                      x: 0
                      y: 0
                    type: EMPTY
              robots:
                - robotId: 00000000-0000-4000-8000-000000000003
                  playerId: 00000000-0000-4000-8000-000000000002
                  position:
                    coordinate:
                      x: 0
                      y: 0
                    orientation: NORTH
              phase: PROGRAMMING
              antenna:
                x: 0
                y: 0
                angle: 1.5707963267948966
              players:
                - playerId: 00000000-0000-4000-8000-000000000002
                  username: Dane
                  lastCheckpoint: 0
                  damage: 0
                  registers:
                    - status: EMPTY
                    - status: EMPTY
                    - status: EMPTY
                    - status: EMPTY
                    - status: EMPTY
                  programSubmitted: false
                  connected: true
              paused: false
            hand:
              - id: 00000000-0000-4000-8000-000000000101
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000102
                instruction: MOVE_2
              - id: 00000000-0000-4000-8000-000000000103
                instruction: MOVE_3
              - id: 00000000-0000-4000-8000-000000000104
                instruction: BACK_UP
              - id: 00000000-0000-4000-8000-000000000105
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000106
                instruction: TURN_RIGHT
              - id: 00000000-0000-4000-8000-000000000107
                instruction: U_TURN
              - id: 00000000-0000-4000-8000-000000000108
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000109
                instruction: TURN_LEFT
            programSubmitted: false
        - name: reconnectedDuringExecution
          summary: Own hand only; another player's first register revealed, later slots hidden
          payload:
            outcome: JOINED
            assignment:
              gameId: 00000000-0000-4000-8000-000000000001
              playerId: 00000000-0000-4000-8000-000000000002
              robotId: 00000000-0000-4000-8000-000000000003
            state:
              gameId: 00000000-0000-4000-8000-000000000001
              roundNumber: 2
              checkpointCount: 2
              board:
                width: 2
                height: 1
                tiles:
                  - position: { x: 0, y: 0 }
                    type: EMPTY
                    checkpointNumber: 1
                  - position: { x: 1, y: 0 }
                    type: EMPTY
                    checkpointNumber: 2
              robots:
                - robotId: 00000000-0000-4000-8000-000000000003
                  playerId: 00000000-0000-4000-8000-000000000002
                  position:
                    coordinate: { x: 0, y: 0 }
                    orientation: NORTH
                - robotId: 00000000-0000-4000-8000-000000000013
                  playerId: 00000000-0000-4000-8000-000000000012
                  position:
                    coordinate: { x: 1, y: 0 }
                    orientation: SOUTH
              phase: EXECUTING
              antenna: { x: 1, y: 0, angle: 1.5707963267948966 }
              players:
                - playerId: 00000000-0000-4000-8000-000000000002
                  username: Dane
                  lastCheckpoint: 0
                  damage: 0
                  programSubmitted: true
                  connected: true
                  registers:
                    - status: HIDDEN
                    - status: HIDDEN
                    - status: HIDDEN
                    - status: HIDDEN
                    - status: HIDDEN
                - playerId: 00000000-0000-4000-8000-000000000012
                  username: Malte
                  lastCheckpoint: 1
                  damage: 2
                  programSubmitted: true
                  connected: true
                  registers:
                    - status: REVEALED
                      instruction: TURN_LEFT
                    - status: HIDDEN
                    - status: HIDDEN
                    - status: HIDDEN
                    - status: HIDDEN
              paused: false
            hand:
              - id: 00000000-0000-4000-8000-000000000110
                instruction: MOVE_1
            programSubmitted: true
        - name: duplicateUser
          summary: Another connection already owns membership
          payload:
            outcome: USER_ALREADY_IN_GAME
        - name: spawnUnavailable
          summary: No partial membership was created
          payload:
            outcome: NO_SPAWN_AVAILABLE
        - name: gameAlreadyStarted
          summary: A new player attempts to join after the first accepted program
          payload:
            outcome: GAME_ALREADY_STARTED

    LeaveGame:
      name: game.leave
      description: >-
        Requests explicit departure for the membership owned by this connection.
        On success, removes the player and robot, frees the occupied tile, and
        removes the connection from the public and private player rooms while
        retaining login. Disconnecting retains membership and does not send
        game.playerLeft. Leaving does not reopen a game that has already started.
      payload:
        $ref: '#/components/schemas/JoinGame'
      examples:
        - name: leave
          summary: Explicitly leave the configured shared game
          payload:
            gameId: 00000000-0000-4000-8000-000000000001

    LeaveResult:
      name: game.leaveResult
      description: >-
        Acknowledges game.leave with LEFT or a rejection. This is returned through
        the request's acknowledgement callback, not emitted as game.leaveResult.
      payload:
        $ref: '#/components/schemas/LeaveResult'
      examples:
        - name: left
          summary: Membership removed; the connection remains logged in
          payload:
            outcome: LEFT
        - name: loginRequired
          summary: The connection has not logged in
          payload:
            outcome: LOGIN_REQUIRED
        - name: invalidRequest
          summary: The request is malformed
          payload:
            outcome: INVALID_REQUEST
        - name: gameNotFound
          summary: Game unavailable or membership not owned by this connection
          payload:
            outcome: GAME_NOT_FOUND
        - name: internalError
          summary: Unexpected service failure
          payload:
            outcome: INTERNAL_ERROR

    PlayerLeft:
      name: game.playerLeft
      description: >-
        Broadcasts the removed player and robot identifiers to remaining members
        in game:{gameId}:public after a successful explicit leave. The leaving
        connection loses public and private room access before LEFT is
        acknowledged and does not receive this broadcast. Recipients remove the
        player, robot, registers, and stats from their public state and discard
        queued updates for that membership. Disconnecting does not emit this event.
      payload:
        $ref: '#/components/schemas/PlayerLeft'
      examples:
        - name: playerLeft
          summary: Remove the departing player and robot from public state
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            robotId: 00000000-0000-4000-8000-000000000003

    PlayerJoined:
      name: game.playerJoined
      description: >-
        Announces a new player and robot, including initial empty registers and
        stats, to existing participants in this lobby only. Never includes a hand.
      payload:
        $ref: '#/components/schemas/PlayerJoined'
      examples:
        - name: playerJoined
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            player:
              playerId: 00000000-0000-4000-8000-000000000002
              username: Dane
              lastCheckpoint: 0
              damage: 0
              programSubmitted: false
              connected: true
              registers:
                - status: EMPTY
                - status: EMPTY
                - status: EMPTY
                - status: EMPTY
                - status: EMPTY
            robot:
              robotId: 00000000-0000-4000-8000-000000000003
              playerId: 00000000-0000-4000-8000-000000000002
              position:
                coordinate: { x: 10, y: 10 }
                orientation: NORTH

    GetLobbyDetails:
      name: game.getLobbyDetails
      description: >-
        Queries for available game lobbies.
      payload:
        $ref: '#/components/schemas/GetLobbyDetails'
      examples:
        - name: lobbyDetails
          summary: List the available lobbies
          payload: {}

    LobbyDetailsResult:
      name: game.lobbyDetailsResult
      description: >-
        Returns the available lobbies or a rejection. This is returned through
        the request's acknowledgement callback, not emitted as game.lobbyDetailsResult.
      payload:
        $ref: '#/components/schemas/LobbyDetailsResult'
      examples:
        - name: found
          summary: One lobby with two players on the demo map
          payload:
            outcome: LOBBY_FOUND
            lobbies:
              - gameId: 00000000-0000-4000-8000-000000000001
                name: Shared game
                players:
                  - playerId: 00000000-0000-4000-8000-000000000011
                    username: Malte
                  - playerId: 00000000-0000-4000-8000-000000000012
                    username: Abid
                map:
                  name: DEMO MAP
                  icon: data:image/svg+xml;base64,PHN2Zy8+
                  maxPlayers: 6
        - name: loginRequired
          summary: The connection has not logged in
          payload:
            outcome: LOGIN_REQUIRED

    SubmitProgram:
      name: program.submit
      payload:
        type: object
        additionalProperties: false
        required:
          - gameId
          - playerId
          - roundNumber
          - cardIds
        properties:
          gameId:
            $ref: "#/components/schemas/GameId"
          playerId:
            $ref: "#/components/schemas/PlayerId"
          roundNumber:
            $ref: '#/components/schemas/RoundNumber'
          cardIds:
            type: array
            description: Card instance IDs in register order.
            minItems: 5
            maxItems: 5
            uniqueItems: true
            items:
              $ref: "#/components/schemas/CardId"
      description: >-
        Submits five cards in register order for the connection-owned player and
        current round. The server verifies membership, matching gameId/playerId,
        phase, pause state, and that every distinct card ID belongs to that player's
        current hand. Public instructions and occupancy markers never authorize
        submission of another player's cards.
      examples:
        - name: submit
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            roundNumber: 1
            cardIds:
              - 00000000-0000-4000-8000-000000000101
              - 00000000-0000-4000-8000-000000000102
              - 00000000-0000-4000-8000-000000000103
              - 00000000-0000-4000-8000-000000000104
              - 00000000-0000-4000-8000-000000000105

    ProgramResult:
      name: program.result
      payload:
        type: object
        required: [ outcome ]
        properties:
          outcome:
            type: string
            enum:
              - ACCEPTED
              - INVALID_PROGRAM
              - GAME_PAUSED
              - ALREADY_SUBMITTED
              - WRONG_PHASE
              - NOT_A_MEMBER
              - STALE_ROUND
              - INVALID_REQUEST
              - GAME_ID_MISMATCH
              - PLAYER_ID_MISMATCH
              - PLAYER_NOT_IN_GAME
              - INTERNAL_ERROR
      description: |
        ACCEPTED: the program was stored.
        INVALID_PROGRAM: the cards did not match the player's hand, or did not cover all five registers.
        GAME_PAUSED: rejected because the game is paused.
        ALREADY_SUBMITTED: this player already has a stored program for the current round; it is unchanged.
        WRONG_PHASE: the round had already moved into activation before this submission arrived.
        NOT_A_MEMBER: this connection does not own a membership for this game.
        INVALID_REQUEST: the request did not match the expected shape.
        STALE_ROUND: roundNumber does not match the current round; no program is changed.
        GAME_ID_MISMATCH: the request's gameId did not match the connection's game.
        PLAYER_ID_MISMATCH: the request's playerId did not match the connection's own player.
        PLAYER_NOT_IN_GAME: the player is no longer part of the game (left or otherwise removed).
        INTERNAL_ERROR: unexpected service failure.
        No acknowledgement means the outcome is unknown.
      examples:
        - name: accepted
          payload:
            outcome: ACCEPTED
        - name: staleRound
          payload:
            outcome: STALE_ROUND

    UpdateRegisters:
      name: program.updateRegisters
      description: >-
        Updates only the connection-owned player's draft slot occupancy while
        programming, after each local placement or removal. Contains no card
        identities and does not store or submit a playable program. Validate
        membership, matching gameId/playerId, current round, programming phase,
        unpaused state, and no accepted program before applying. Reject malformed
        requests without changing state. Accepted changes emit game.playerStateChanged
        to every connected member of this lobby, including the sender.
      payload:
        type: object
        additionalProperties: false
        required: [ gameId, playerId, roundNumber, occupied ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          playerId:
            $ref: '#/components/schemas/PlayerId'
          roundNumber:
            $ref: '#/components/schemas/RoundNumber'
          occupied:
            type: array
            minItems: 5
            maxItems: 5
            description: Full draft in register order; true becomes HIDDEN, false becomes EMPTY.
            items:
              type: boolean
      examples:
        - name: firstTwoPlaced
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            roundNumber: 1
            occupied: [ true, true, false, false, false ]

    RegisterUpdateResult:
      name: program.updateRegistersResult
      description: |
        Acknowledges program.updateRegisters, not a separate event.
        ACCEPTED: draft occupancy applied; no program was submitted.
        INVALID_REQUEST: malformed payload, including an invalid occupied array.
        NOT_A_MEMBER: this connection does not own a game membership.
        GAME_ID_MISMATCH / PLAYER_ID_MISMATCH: identifiers do not match that membership.
        PLAYER_NOT_IN_GAME: the player has been removed.
        STALE_ROUND: roundNumber differs from the current round.
        WRONG_PHASE / GAME_PAUSED: gameplay does not currently allow editing.
        ALREADY_SUBMITTED: an accepted program cannot be edited.
        INTERNAL_ERROR: unexpected service failure.
        Rejections leave occupancy and program unchanged.
      payload:
        type: object
        additionalProperties: false
        required: [ outcome ]
        properties:
          outcome:
            type: string
            enum:
              - ACCEPTED
              - INVALID_REQUEST
              - NOT_A_MEMBER
              - GAME_ID_MISMATCH
              - PLAYER_ID_MISMATCH
              - PLAYER_NOT_IN_GAME
              - STALE_ROUND
              - WRONG_PHASE
              - GAME_PAUSED
              - ALREADY_SUBMITTED
              - INTERNAL_ERROR
      examples:
        - name: accepted
          payload:
            outcome: ACCEPTED
        - name: anotherPlayer
          payload:
            outcome: PLAYER_ID_MISMATCH

    PlayerStateChanged:
      name: game.playerStateChanged
      description: >-
        Broadcasts the complete public PlayerState to every connected lobby member
        after a draft occupancy change or any damage change, including changes
        outside robot actions. No hand or unexecuted card identity is included.
        Apply only for an existing player in the current game and round; this event
        cannot create membership. Replaces that player's public state. Preserve
        already revealed slots until the next game.programmingStarted. Checkpoint,
        submission, execution, and connection changes use their existing events.
        Damage caused by an action follows its robot.actionResolved and precedes
        subsequent actions and the next round start, so it cannot reveal a register
        before the execution event. All public state events share server order.
      payload:
        type: object
        additionalProperties: false
        required: [ gameId, roundNumber, player ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          roundNumber:
            $ref: '#/components/schemas/RoundNumber'
          player:
            $ref: '#/components/schemas/PlayerState'
      examples:
        - name: draftChanged
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            player:
              playerId: 00000000-0000-4000-8000-000000000002
              username: Dane
              lastCheckpoint: 0
              damage: 0
              programSubmitted: false
              connected: true
              registers:
                - status: HIDDEN
                - status: HIDDEN
                - status: EMPTY
                - status: EMPTY
                - status: EMPTY
        - name: damageChanged
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            player:
              playerId: 00000000-0000-4000-8000-000000000002
              username: Dane
              lastCheckpoint: 0
              damage: 2
              programSubmitted: true
              connected: true
              registers:
                - status: REVEALED
                  instruction: MOVE_1
                - status: HIDDEN
                - status: HIDDEN
                - status: HIDDEN
                - status: HIDDEN

    ProgrammingStarted:
      name: game.programmingStarted
      description: >-
        Broadcasts a new round to every connected lobby member after the previous
        round's actions and stat updates, before any private cards.dealt. Increment
        roundNumber once per new deal. Atomically set phase to PROGRAMMING, every
        remaining player's five registers to EMPTY, and programSubmitted to false;
        preserve stats, membership, and connection state. Clear the previous active
        register and discard its pending draft updates. Initial JOINED provides the
        same baseline for round 1. Duplicate or older round starts have no effect.
      payload:
        type: object
        additionalProperties: false
        required: [ gameId, roundNumber ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          roundNumber:
            $ref: '#/components/schemas/RoundNumber'
      examples:
        - name: nextRound
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 2

    ProgramSubmitted:
      name: program.submitted
      description: >-
        Broadcasts an accepted program to every connected member of this lobby.
        Set this player's programSubmitted to true and all five registers to HIDDEN,
        without any card identity. phase is the authoritative phase after acceptance;
        the final required submission changes it to EXECUTING. When a departure
        makes the remaining programs ready, the first robot.actionResolved establishes
        EXECUTING. Apply only for an existing player and the current round.
      payload:
        type: object
        additionalProperties: false
        required:
          - playerId
          - gameId
          - roundNumber
          - phase
        properties:
          playerId:
            $ref: "#/components/schemas/PlayerId"
          gameId:
            $ref: "#/components/schemas/GameId"
          roundNumber:
            $ref: '#/components/schemas/RoundNumber'
          phase:
            $ref: '#/components/schemas/GamePhase'
      examples:
        - name: ready
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            roundNumber: 1
            phase: EXECUTING

    RobotActionResolved:
      name: robot.actionResolved
      payload:
        type: object
        additionalProperties: false
        required:
          - robotId
          - instruction
          - position
          - gameId
          - registerIndex
          - playerId
          - roundNumber
        properties:
          robotId:
            $ref: "#/components/schemas/RobotId"
          instruction:
            $ref: "#/components/schemas/Instruction"
          position:
            $ref: "#/components/schemas/Position"
          gameId:
            $ref: "#/components/schemas/GameId"
          registerIndex:
            type: integer
            minimum: 0
            maximum: 4
            description: Zero-based register index; display 1–5. Multiple robot actions can share one index.
          playerId:
            $ref: '#/components/schemas/PlayerId'
          roundNumber:
            $ref: '#/components/schemas/RoundNumber'
      description: >-
        Reports the resulting robot state after one programmed instruction to every
        connected lobby member. playerId must match the robot's owner. Establishes
        EXECUTING and reveals only that player's registerIndex as REVEALED with the
        executed instruction; no card instance ID is sent. Other filled registers
        stay HIDDEN until their own execution. Apply actions in received order only
        for existing players in the current round. Snapshots retain these reveals.
      examples:
        - name: firstRegister
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            registerIndex: 0
            roundNumber: 1
            playerId: 00000000-0000-4000-8000-000000000002
            robotId: 00000000-0000-4000-8000-000000000003
            instruction: MOVE_1
            position:
              coordinate:
                x: 10
                y: 6
              orientation: NORTH

    PlayerCheckpointProgress:
      name: player.checkpointProgress
      description: >-
        Broadcasts changed player checkpoint progress to game:{gameId}:public after the
        related robot.actionResolved, or game.playerLeft when a departure finishes a
        register, and before subsequent actions or private hands. Unchanged progress
        produces no event. Clients apply progress on receipt without changing movement
        playback or programming availability. Replayed events must not reduce progress.
      payload:
        type: object
        additionalProperties: false
        required: [ gameId, roundNumber, playerId, lastCheckpoint, checkpointCount ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          playerId:
            $ref: '#/components/schemas/PlayerId'
          lastCheckpoint:
            $ref: '#/components/schemas/LastCheckpoint'
          checkpointCount:
            $ref: '#/components/schemas/CheckpointCount'
          roundNumber:
            $ref: '#/components/schemas/RoundNumber'
      examples:
        - name: firstCheckpoint
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            roundNumber: 1
            playerId: 00000000-0000-4000-8000-000000000002
            lastCheckpoint: 1
            checkpointCount: 2

    CardsDealt:
      name: cards.dealt
      payload:
        type: object
        required:
          - cards
          - gameId
          - playerId
          - roundNumber
        properties:
          cards:
            type: array
            items:
              $ref: "#/components/schemas/Card"
          gameId:
            $ref: "#/components/schemas/GameId"
          playerId:
            $ref: "#/components/schemas/PlayerId"
          roundNumber:
            $ref: '#/components/schemas/RoundNumber'
      description: >-
        Private hand dealt only to the membership-owning connection for the named
        player and round, never to another player or the public room. Follows
        game.programmingStarted for a new round. Does not reset public registers;
        apply only for the current game, own player, and current round.
      examples:
        - name: nextHand
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            roundNumber: 2
            cards:
              - id: 00000000-0000-4000-8000-000000000101
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000102
                instruction: MOVE_2
              - id: 00000000-0000-4000-8000-000000000103
                instruction: MOVE_3
              - id: 00000000-0000-4000-8000-000000000104
                instruction: BACK_UP
              - id: 00000000-0000-4000-8000-000000000105
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000106
                instruction: TURN_RIGHT
              - id: 00000000-0000-4000-8000-000000000107
                instruction: U_TURN
              - id: 00000000-0000-4000-8000-000000000108
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000109
                instruction: TURN_LEFT

    PlayerConnectionChanged:
      name: game.playerConnectionChanged
      description: >-
        Announces an existing player's connection status and the resulting game
        pause state to this lobby only. Temporary disconnection retains that
        player's registers and stats; only game.playerLeft removes them.
      payload:
        $ref: '#/components/schemas/PlayerConnectionChanged'
      examples:
        - name: disconnected
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: false
            paused: true
        - name: reconnectedWhileAnotherPlayerIsDisconnected
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: true
            paused: true
        - name: reconnectedAndGameResumed
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: true
            paused: false

    GameAborted:
      name: game.aborted
      description: >-
        Announces that gameplay has stopped irrecoverably after an unexpected service failure. 
      payload:
        $ref: '#/components/schemas/GameAborted'
      examples:
        - name: aborted
          payload:
            gameId: 00000000-0000-4000-8000-000000000001

  schemas:

    # Login
    Username:
      type: string
      minLength: 1
      maxLength: 30
      description: |
        Username length is measured in Unicode code points. Whitespace and case are preserved; no normalization is applied yet.

    User:
      type: object
      additionalProperties: false
      required: [ userId, username ]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        username:
          $ref: '#/components/schemas/Username'

    Login:
      type: object
      additionalProperties: false
      required: [ username ]
      properties:
        username:
          $ref: '#/components/schemas/Username'

    LoginResult:
      oneOf:
        - $ref: '#/components/schemas/LoginAccepted'
        - $ref: '#/components/schemas/LoginRejected'

    LoginAccepted:
      type: object
      additionalProperties: false
      required: [ outcome, user ]
      properties:
        outcome:
          type: string
          enum: [ LOGGED_IN ]
        user:
          $ref: '#/components/schemas/User'

    LoginRejected:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ INVALID_USERNAME, INVALID_REQUEST, ALREADY_LOGGED_IN, INTERNAL_ERROR ]
      description: |
        INVALID_USERNAME covers a missing/non-string username or a length outside 1–30.
        INVALID_REQUEST: the request did not match the expected shape.
        ALREADY_LOGGED_IN means this connection is bound to a different username.
        Repeating login with the same username returns LOGGED_IN with the same user.
        INTERNAL_ERROR is an unexpected service failure; do not expose internals.

    # Membership
    JoinGame:
      type: object
      additionalProperties: false
      required: [ gameId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'

    PlayerAssignment:
      type: object
      additionalProperties: false
      required: [ gameId, playerId, robotId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        robotId:
          $ref: '#/components/schemas/RobotId'

    JoinResult:
      oneOf:
        - $ref: '#/components/schemas/JoinAccepted'
        - $ref: '#/components/schemas/JoinRejected'

    JoinAccepted:
      type: object
      additionalProperties: false
      required:
        - outcome
        - assignment
        - state
        - hand
        - programSubmitted
      properties:
        outcome:
          type: string
          enum:
            - JOINED
        assignment:
          $ref: "#/components/schemas/PlayerAssignment"
        state:
          $ref: "#/components/schemas/PublicGameState"
        hand:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: Only assignment.playerId's private hand, never any other player's hand.

        programSubmitted:
          type: boolean
          description: Whether this player has submitted for the current round.
      description: >-
        Returns a new assignment or preserves the existing assignment when
        reconnecting. state.players contains every current lobby member, including
        disconnected members, with registers and stats keyed by playerId. The
        top-level programSubmitted equals the assigned player's state value.

    JoinRejected:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum:
            [
              LOGIN_REQUIRED,
              INVALID_REQUEST,
              NO_SPAWN_AVAILABLE,
              USER_ALREADY_IN_GAME,
              GAME_ALREADY_STARTED,
              INTERNAL_ERROR
            ]
      description: >-
        LOGIN_REQUIRED: no approved user. INVALID_REQUEST: the request did not match the expected shape.
        GAME_NOT_FOUND: unavailable game. NO_SPAWN_AVAILABLE: no valid spawn.
        GAME_ALREADY_STARTED: The game has already accepted its first program.
        USER_ALREADY_IN_GAME: another connection currently owns this user's membership. 

    LeaveResult:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ LEFT, LOGIN_REQUIRED, INVALID_REQUEST, GAME_NOT_FOUND, INTERNAL_ERROR ]
      description: |
        LEFT: membership and robot removed, room access revoked, login retained.
        LOGIN_REQUIRED: this connection has no approved user.
        INVALID_REQUEST: the request did not match the expected shape.
        GAME_NOT_FOUND: unavailable game or membership not owned by this connection;
        this also covers a repeated leave after a successful departure.
        INTERNAL_ERROR: unexpected service failure; do not expose internals.

    PlayerLeft:
      type: object
      additionalProperties: false
      required: [ gameId, playerId, robotId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        robotId:
          $ref: '#/components/schemas/RobotId'

    PlayerState:
      type: object
      additionalProperties: false
      required:
        - playerId
        - username
        - programSubmitted
        - connected
        - lastCheckpoint
        - damage
        - registers
      properties:
        playerId:
          $ref: "#/components/schemas/PlayerId"
        username:
          $ref: "#/components/schemas/Username"
        programSubmitted:
          type: boolean
        connected:
          type: boolean
        lastCheckpoint:
          $ref: '#/components/schemas/LastCheckpoint'
        damage:
          $ref: '#/components/schemas/Damage'
        registers:
          $ref: '#/components/schemas/PublicRegisters'
      description: >-
        Public participation, register, and stat state for one player. Never contains
        a hand or card instance IDs. Every player, including the owner, gets the same
        public projection: EMPTY for unfilled slots, HIDDEN for placed unexecuted
        cards, and REVEALED only after that register executes in the current round.
        Draft occupancy is not an accepted program; programSubmitted changes only
        on acceptance or a new round.

    PlayerJoined:
      type: object
      additionalProperties: false
      required:
        - gameId
        - player
        - robot
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        player:
          $ref: "#/components/schemas/PlayerState"
        robot:
          $ref: "#/components/schemas/Robot"
      description: >-
        player.playerId must equal robot.playerId.

    PublicGameState:
      description: >-
        Public board, robot, player registers/stats, phase, round, and antenna state
        for this lobby only. players contains every current member exactly once by
        playerId, including disconnected members; departed members are absent.
        On join or reconnect replace the old snapshot before applying ordered live
        events. Ignore events from another game, an older round, or removed players.
        Events for a newer round require its game.programmingStarted first; if that
        baseline is unavailable, rejoin for a fresh snapshot rather than merge stale
        state. Stored animation playback must not overwrite newer-round live state.
      type: object
      additionalProperties: false
      required:
        - gameId
        - board
        - antenna
        - players
        - robots
        - phase
        - paused
        - checkpointCount
        - roundNumber
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        board:
          $ref: "#/components/schemas/Board"
        robots:
          type: array
          items:
            $ref: "#/components/schemas/Robot"
        phase:
          $ref: "#/components/schemas/GamePhase"
        antenna:
          $ref: "#/components/schemas/Antenna"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerState"
        paused:
          type: boolean
          description: Whether gameplay is paused because a game member is disconnected.
        checkpointCount:
          $ref: '#/components/schemas/CheckpointCount'
        roundNumber:
          $ref: '#/components/schemas/RoundNumber'

    RoundNumber:
      type: integer
      minimum: 1
      description: >-
        Lobby-local round number, initially 1; increments on each new programming
        deal. Identifies the round of snapshots, private hands, and register/stat
        updates. Stale submissions and occupancy requests are rejected.

    Damage:
      type: integer
      minimum: 0
      description: Current authoritative damage count; initially 0, preserved on reconnect.

    PublicRegisters:
      type: array
      minItems: 5
      maxItems: 5
      description: Five slots in zero-based register order, displayed as registers 1–5.
      items:
        oneOf:
          - $ref: '#/components/schemas/EmptyRegister'
          - $ref: '#/components/schemas/HiddenRegister'
          - $ref: '#/components/schemas/RevealedRegister'

    EmptyRegister:
      type: object
      additionalProperties: false
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ EMPTY ]
      description: Unfilled slot; carries no card identity.

    HiddenRegister:
      type: object
      additionalProperties: false
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ HIDDEN ]
      description: >-
        Face-down placed card. This marker is the entire slot payload: no card ID,
        instruction, type, hash, or other card identity may be included.

    RevealedRegister:
      type: object
      additionalProperties: false
      required: [ status, instruction ]
      properties:
        status:
          type: string
          enum: [ REVEALED ]
        instruction:
          $ref: '#/components/schemas/Instruction'
      description: Instruction made public by this owner's register execution; no instance ID.

    LastCheckpoint:
      type: integer
      minimum: 0
      description: >-
        Last checkpoint completed by the player in numerical order, initially 0.
        Must not exceed checkpointCount. Persists across rounds and reconnections.
        Completing the final checkpoint does not end the game.

    CheckpointCount:
      type: integer
      minimum: 0
      description: Total number of checkpoints on the board; 0 on a board without checkpoints.

    GetLobbyDetails:
      type: object
      additionalProperties: false


    GameMap:
      type: object
      additionalProperties: false
      required: [ name, icon, maxPlayers ]
      properties:
        name:
          type: string
          description: Display name of the map.
        icon:
          type: string
          description: Map icon as a base64-encoded image data URI.
        maxPlayers:
          type: integer
          minimum: 1
          description: Most players the map supports.


    LobbyPlayer:
      type: object
      additionalProperties: false
      required: [ playerId, username ]
      properties:
        playerId:
          $ref: '#/components/schemas/PlayerId'
        username:
          $ref: '#/components/schemas/Username'

    LobbyDetails:
      type: object
      additionalProperties: false
      required: [ gameId, name, players, map ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        name:
          type: string
          description: Display name of the game.
        players:
          type: array
          description: Current members in join order, including disconnected members.
          items:
            $ref: '#/components/schemas/LobbyPlayer'
        map:
          $ref: '#/components/schemas/GameMap'
      description: >-
        Lobby information

    LobbyDetailsResult:
      oneOf:
        - $ref: '#/components/schemas/LobbyFound'
        - $ref: '#/components/schemas/LobbyDetailsRejected'

    LobbyFound:
      type: object
      additionalProperties: false
      required: [ outcome, lobbies ]
      properties:
        outcome:
          type: string
          enum: [ LOBBY_FOUND ]
        lobbies:
          type: array
          items:
            $ref: '#/components/schemas/LobbyDetails'

    LobbyDetailsRejected:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ LOGIN_REQUIRED, INVALID_REQUEST, INTERNAL_ERROR ]
      description: |
        LOGIN_REQUIRED: this connection has no approved user; checked before the payload.
        INVALID_REQUEST: the request did not match the expected shape.
        INTERNAL_ERROR: unexpected service failure; do not expose internals.

    GamePhase:
      type: string
      enum:
        - PROGRAMMING
        - EXECUTING
      description: EXECUTING means domain activation. No lobby/WAITING phase.

    # Shared types
    UserId:
      type: string
      format: uuid
      description: Opaque service-issued user identifier.

    GameId:
      type: string
      format: uuid

    PlayerId:
      type: string
      format: uuid

    RobotId:
      type: string
      format: uuid

    CardId:
      type: string
      format: uuid

    Instruction:
      type: string
      enum: [ MOVE_1, MOVE_2, MOVE_3, BACK_UP, TURN_LEFT, TURN_RIGHT, U_TURN ]

    Card:
      type: object
      required: [ id, instruction ]
      properties:
        id:
          $ref: '#/components/schemas/CardId'
          description: Unique card instance ID
        instruction:
          $ref: '#/components/schemas/Instruction'

    Orientation:
      type: string
      enum: [ NORTH, EAST, SOUTH, WEST ]

    Coordinate:
      type: object
      description: A board location without a facing direction.
      required: [ x, y ]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0

    Position:
      type: object
      required: [ coordinate, orientation ]
      properties:
        coordinate:
          $ref: '#/components/schemas/Coordinate'
        orientation:
          $ref: '#/components/schemas/Orientation'

    Robot:
      type: object
      required: [ robotId, playerId, position ]
      properties:
        robotId:
          $ref: '#/components/schemas/RobotId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        position:
          $ref: '#/components/schemas/Position'

    Board:
      type: object
      required: [ width, height, tiles ]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/Tile'

    Tile:
      type: object
      required: [ position, type ]
      properties:
        position:
          $ref: '#/components/schemas/Coordinate'
        type:
          type: string
          enum: [ EMPTY ]
        walls:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Orientation'
        checkpointNumber:
          type: integer
          minimum: 1
          description: >-
            Optional checkpoint on this tile, independent of its walls and type.
            Omit when absent. Numbers are unique and consecutive from 1 on a board.
            Checkpoints stay at their fixed positions and are available to every player.
    Antenna:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - angle
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        angle:
          type: number
      description: >-
        Fixed game configuration. Coordinates must be on the board. Angle is radians clockwise from
        east (south is pi/2), matching the documented priority algorithm. Does not occupy a robot
        slot or add board effects. The current 21×15 test board uses x=10, y=0, angle=pi/2 (south).
        For other widths use floor(width/2), y=0, facing south; keep configuration fixed per game.

    PlayerConnectionChanged:
      type: object
      additionalProperties: false
      required:
        - gameId
        - playerId
        - connected
        - paused
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        connected:
          type: boolean
          description: The player's connection status after this change.
        paused:
          type: boolean
          description: Whether any game member remains disconnected after this change.

    GameAborted:
      type: object
      additionalProperties: false
      required: [ gameId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
