    GetPublicGameState:
      name: game.getPublicGameState
      payload:
        type: object
        additionalProperties: false
        required: [ gameId ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
      description: >-
        Requests the public state of the game joined by this connection.

    PublicGameStateResult:
      name: game.publicGameStateResult
      description: Returns the public game state or GAME_NOT_FOUND.
      payload:
        oneOf:
          - $ref: '#/components/schemas/PublicGameStateFound'
          - $ref: '#/components/schemas/PublicGameStateNotFound'
      examples:
        - name: nonmember
          payload:
            outcome: GAME_NOT_FOUND

    SubmitProgram:
      name: program.submit
      payload:
        type: object
        additionalProperties: false
        required:
          - gameId
          - playerId
          - cardIds
        properties:
          gameId:
            $ref: "#/components/schemas/GameId"
          playerId:
            $ref: "#/components/schemas/PlayerId"
          cardIds:
            type: array
            description: Card instance IDs in register order.
            minItems: 5
            maxItems: 5
            uniqueItems: true
            items:
              $ref: "#/components/schemas/CardId"
      description: >-
        Submits five cards in register order for the connection-owned player.
      examples:
        - name: submit
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            cardIds:
              - 00000000-0000-4000-8000-000000000101
              - 00000000-0000-4000-8000-000000000102
              - 00000000-0000-4000-8000-000000000103
              - 00000000-0000-4000-8000-000000000104
              - 00000000-0000-4000-8000-000000000105

    ProgramResult:
      name: program.result
      payload:
        type: object
        required: [ outcome ]
        properties:
          outcome:
            type: string
            enum:
              - ACCEPTED
              - INVALID_PROGRAM
              - INTERNAL_ERROR
              - GAME_PAUSED
      description: >-
        ACCEPTED confirms the program was stored. INVALID_PROGRAM rejects the
        submission without changing game state. INTERNAL_ERROR means the service
        failed before accepting it. GAME_PAUSED rejects a submission because the game is paused. 
        No acknowledgement means the outcome is unknown.

    ProgramSubmitted:
      name: program.submitted
      description: >-
        Event signaling another player has submitted their program.
      payload:
        type: object
        required:
          - playerId
          - gameId
        properties:
          playerId:
            $ref: "#/components/schemas/PlayerId"
          gameId:
            $ref: "#/components/schemas/GameId"
      examples:
        - name: ready
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002

    RobotActionResolved:
      name: robot.actionResolved
      payload:
        type: object
        required:
          - robotId
          - instruction
          - position
          - gameId
          - registerIndex
        properties:
          robotId:
            $ref: "#/components/schemas/RobotId"
          instruction:
            $ref: "#/components/schemas/Instruction"
          position:
            $ref: "#/components/schemas/Position"
          gameId:
            $ref: "#/components/schemas/GameId"
          registerIndex:
            type: integer
            minimum: 0
            maximum: 4
            description: Zero-based register index; display 1–5. Multiple robot actions can share one index.
      description: >-
        Reports the resulting robot state after one programmed instruction.
      examples:
        - name: firstRegister
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            registerIndex: 0
            robotId: 00000000-0000-4000-8000-000000000003
            instruction: MOVE_1
            position:
              coordinate:
                x: 10
                y: 6
              orientation: NORTH

    CardsDealt:
      name: cards.dealt
      payload:
        type: object
        required:
          - cards
          - gameId
          - playerId
        properties:
          cards:
            type: array
            items:
              $ref: "#/components/schemas/Card"
          gameId:
            $ref: "#/components/schemas/GameId"
          playerId:
            $ref: "#/components/schemas/PlayerId"
      description: >-
        Private hand dealt to the named player for a programming round.
      examples:
        - name: nextHand
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            cards:
              - id: 00000000-0000-4000-8000-000000000101
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000102
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000103
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000104
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000105
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000106
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000107
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000108
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000109
                instruction: MOVE_1

    PlayerConnectionChanged:
      name: game.playerConnectionChanged
      description: >-
        Announces an existing player's connection status and the resulting
        game pause state. 
      payload:
        $ref: '#/components/schemas/PlayerConnectionChanged'
      examples:
        - name: disconnected
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: false
            paused: true
        - name: reconnectedWhileAnotherPlayerIsDisconnected
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: true
            paused: true
        - name: reconnectedAndGameResumed
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: true
            paused: false

  schemas:

    # Lobbies
    LobbyMap:
      type: string
      enum: [ 'Map 1', 'Map 2' ]

    LobbyCode:
      type: string
      pattern: '^[A-HJ-NP-Z2-9]{6}$'
      description: Six-character code omitting visually ambiguous characters.

    LobbyPlayer:
      type: object
      additionalProperties: false
      required: [ userId, username ]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        username:
          $ref: '#/components/schemas/Username'

    LobbySummary:
      type: object
      additionalProperties: false
      required: [ lobbyId, code, name, map, playerCount, capacity, status, countdownEndsAt ]
      properties:
        lobbyId:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/LobbyCode'
        name:
          type: string
          minLength: 1
          maxLength: 32
        map:
          $ref: '#/components/schemas/LobbyMap'
        playerCount:
          type: integer
          minimum: 0
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ WAITING, COUNTDOWN, STARTED ]
        countdownEndsAt:
          type: [ integer, 'null' ]
          description: Unix epoch milliseconds, or null when not counting down.

    LobbyState:
      type: object
      additionalProperties: false
      required: [ lobbyId, code, name, map, playerCount, capacity, status, countdownEndsAt, players ]
      properties:
        lobbyId:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/LobbyCode'
        name:
          type: string
          minLength: 1
          maxLength: 32
        map:
          $ref: '#/components/schemas/LobbyMap'
        playerCount:
          type: integer
          minimum: 0
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ WAITING, COUNTDOWN, STARTED ]
        countdownEndsAt:
          type: [ integer, 'null' ]
        players:
          type: array
          items:
            $ref: '#/components/schemas/LobbyPlayer'

    CreateLobby:
      type: object
      additionalProperties: false
      required: [ name, code, map ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        code:
          $ref: '#/components/schemas/LobbyCode'
        map:
          $ref: '#/components/schemas/LobbyMap'

    JoinLobby:
      type: object
      additionalProperties: false
      required: [ code ]
      properties:
        code:
          $ref: '#/components/schemas/LobbyCode'

    LobbyListResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ outcome, lobbies ]
          properties:
            outcome:
              const: LOBBIES_LISTED
            lobbies:
              type: array
              items:
                $ref: '#/components/schemas/LobbySummary'
        - type: object
          additionalProperties: false
          required: [ outcome ]
          properties:
            outcome:
              const: LOGIN_REQUIRED

    LobbyCreateResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ outcome, state ]
          properties:
            outcome:
              const: LOBBY_CREATED
            state:
              $ref: '#/components/schemas/LobbyState'
        - type: object
          additionalProperties: false
          required: [ outcome ]
          properties:
            outcome:
              type: string
              enum: [ LOGIN_REQUIRED, INVALID_REQUEST, INTERNAL_ERROR, ALREADY_IN_LOBBY, USER_ALREADY_IN_LOBBY, LOBBY_CODE_TAKEN ]

    LobbyJoinResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ outcome, state ]
          properties:
            outcome:
              const: LOBBY_JOINED
            state:
              $ref: '#/components/schemas/LobbyState'
        - type: object
          additionalProperties: false
          required: [ outcome ]
          properties:
            outcome:
              type: string
              enum: [ LOGIN_REQUIRED, INVALID_REQUEST, LOBBY_NOT_FOUND, LOBBY_FULL, ALREADY_IN_LOBBY, USER_ALREADY_IN_LOBBY, LOBBY_STARTED, INTERNAL_ERROR ]

    LobbyLeaveResult:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ LEFT_LOBBY, NOT_IN_LOBBY ]

    LobbyStarted:
      type: object
      additionalProperties: false
      required: [ lobbyId, code, gameId ]
      properties:
        lobbyId:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/LobbyCode'
        gameId:
          $ref: '#/components/schemas/GameId'

    # Login
    Username:
      type: string
      minLength: 1
      maxLength: 30
      description: |
        Username length is measured in Unicode code points. Whitespace and case are preserved; no normalization is applied yet.

    User:
      type: object
      additionalProperties: false
      required: [ userId, username ]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        username:
          $ref: '#/components/schemas/Username'

    Login:
      type: object
      additionalProperties: false
      required: [ username ]
      properties:
        username:
          $ref: '#/components/schemas/Username'

    LoginResult:
      oneOf:
        - $ref: '#/components/schemas/LoginAccepted'
        - $ref: '#/components/schemas/LoginRejected'

    LoginAccepted:
      type: object
      additionalProperties: false
      required: [ outcome, user ]
      properties:
        outcome:
          type: string
          enum: [ LOGGED_IN ]
        user:
          $ref: '#/components/schemas/User'

    LoginRejected:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ INVALID_USERNAME, INVALID_REQUEST, ALREADY_LOGGED_IN, INTERNAL_ERROR ]
      description: |
        INVALID_USERNAME covers a missing/non-string username or a length outside 1–30.
        INVALID_REQUEST covers a non-object request or additional properties.
        ALREADY_LOGGED_IN means this connection is bound to a different username.
        Repeating login with the same username returns LOGGED_IN with the same user.
        INTERNAL_ERROR is an unexpected service failure; do not expose internals.

    # Membership
    JoinGame:
      type: object
      additionalProperties: false
      required: [ gameId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'

    PlayerAssignment:
      type: object
      additionalProperties: false
      required: [ gameId, playerId, robotId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        robotId:
          $ref: '#/components/schemas/RobotId'

    JoinResult:
      oneOf:
        - $ref: '#/components/schemas/JoinAccepted'
        - $ref: '#/components/schemas/JoinRejected'

    JoinAccepted:
      type: object
      additionalProperties: false
      required:
        - outcome
        - assignment
        - state
        - hand
        - programSubmitted
      properties:
        outcome:
          type: string
          enum:
            - JOINED
        assignment:
          $ref: "#/components/schemas/PlayerAssignment"
        state:
          $ref: "#/components/schemas/PublicGameState"
        hand:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: The player's current private hand.

        programSubmitted:
          type: boolean
          description: Whether this player has submitted for the current round.
      description:  Returns a new assignment or preserves the existing assignment when reconnecting.

    JoinRejected:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum:
            [
              LOGIN_REQUIRED,
              INVALID_REQUEST,
              GAME_NOT_FOUND,
              NO_SPAWN_AVAILABLE,
              USER_ALREADY_IN_GAME,
              GAME_ALREADY_STARTED,
              INTERNAL_ERROR
            ]
      description: >-
        LOGIN_REQUIRED: no approved user. INVALID_REQUEST: malformed request.
        GAME_NOT_FOUND: unavailable game. NO_SPAWN_AVAILABLE: no valid spawn.
        GAME_ALREADY_STARTED: The game has already accepted its first program.
        USER_ALREADY_IN_GAME: another connection currently owns this user's membership. 

    PlayerState:
      type: object
      additionalProperties: false
      required:
        - playerId
        - username
        - programSubmitted
        - connected
      properties:
        playerId:
          $ref: "#/components/schemas/PlayerId"
        username:
          $ref: "#/components/schemas/Username"
        programSubmitted:
          type: boolean
        connected:
          type: boolean
      description: >-
        Public participation and submission status; never contains cards.

    PlayerJoined:
      type: object
      additionalProperties: false
      required:
        - gameId
        - player
        - robot
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        player:
          $ref: "#/components/schemas/PlayerState"
        robot:
          $ref: "#/components/schemas/Robot"
      description: >-
        player.playerId must equal robot.playerId.

    PublicGameState:
      description: >-
        Public board, robot, player, phase, and antenna state for a game.
      type: object
      required:
        - gameId
        - board
        - antenna
        - players
        - robots
        - phase
        - paused
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        board:
          $ref: "#/components/schemas/Board"
        robots:
          type: array
          items:
            $ref: "#/components/schemas/Robot"
        phase:
          $ref: "#/components/schemas/GamePhase"
        antenna:
          $ref: "#/components/schemas/Antenna"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerState"
        paused:
          type: boolean
          description: Whether gameplay is paused because a game member is disconnected.

    PublicGameStateFound:
      type: object
      additionalProperties: false
      required: [ outcome, state ]
      properties:
        outcome:
          type: string
          enum: [ GAME_FOUND ]
        state:
          $ref: '#/components/schemas/PublicGameState'

    PublicGameStateNotFound:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ GAME_NOT_FOUND ]
      description: >-
        No accessible game: the game is unknown, the connection is not a member, or the request is
        malformed. Do not return state or reveal whether an inaccessible game exists.

    GamePhase:
      type: string
      enum:
        - PROGRAMMING
        - EXECUTING
      description: EXECUTING means domain activation. No lobby/WAITING phase.

    # Shared types
    UserId:
      type: string
      format: uuid
      description: Opaque service-issued user identifier.

    GameId:
      type: string
      format: uuid

    PlayerId:
      type: string
      format: uuid

    RobotId:
      type: string
      format: uuid

    CardId:
      type: string
      format: uuid

    Instruction:
      type: string
      enum: [ MOVE_1, TURN_LEFT ]

    Card:
      type: object
      required: [ id, instruction ]
      properties:
        id:
          $ref: '#/components/schemas/CardId'
          description: Unique card instance ID
        instruction:
          $ref: '#/components/schemas/Instruction'

    Orientation:
      type: string
      enum: [ NORTH, EAST, SOUTH, WEST ]

    Coordinate:
      type: object
      description: A board location without a facing direction.
      required: [ x, y ]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0

    Position:
      type: object
      required: [ coordinate, orientation ]
      properties:
        coordinate:
          $ref: '#/components/schemas/Coordinate'
        orientation:
          $ref: '#/components/schemas/Orientation'

    Robot:
      type: object
      required: [ robotId, playerId, position ]
      properties:
        robotId:
          $ref: '#/components/schemas/RobotId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        position:
          $ref: '#/components/schemas/Position'

    Board:
      type: object
      required: [ width, height, tiles ]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/Tile'

    Tile:
      type: object
      required: [ position, type ]
      properties:
        position:
          $ref: '#/components/schemas/Coordinate'
        type:
          type: string
          enum: [ EMPTY ]
        walls:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Orientation'
    Antenna:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - angle
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        angle:
          type: number
      description: >-
        Fixed game configuration. Coordinates must be on the board. Angle is radians clockwise from
        east (south is pi/2), matching the documented priority algorithm. Does not occupy a robot
        slot or add board effects. The current 21×15 test board uses x=10, y=0, angle=pi/2 (south).
        For other widths use floor(width/2), y=0, facing south; keep configuration fixed per game.

    PlayerConnectionChanged:
      type: object
      additionalProperties: false
      required:
        - gameId
        - playerId
        - connected
        - paused
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        connected:
          type: boolean
          description: The player's connection status after this change.
        paused:
          type: boolean
          description: Whether any game member remains disconnected after this change.
