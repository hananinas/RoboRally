asyncapi: 3.1.0

info:
  title: Game Service 
  version: 0.0.0
  description: |
    Server API. Each Socket.IO event carries one JSON payload.
    Message name = Socket.IO event name.
    Room channel address = server broadcast destination.
    Commands are emitted directly to the server.
defaultContentType: application/json


channels:
  commands:
    address: commands
    description: inbound channel for messages/events emitted by the client; not a Socket.IO room.
    x-socketio:
      routing: client-to-server
    messages:
      submitProgram:
        $ref: '#/components/messages/SubmitProgram'
      getPublicGameState:
        $ref: '#/components/messages/GetPublicGameState'

  programReplies:
    address: null
    description: |
      Logical reply channel, not a Socket.IO room. 
      Delivered through the acknowledgement callback of program.submit.
    messages:
      programResult:
        $ref: '#/components/messages/ProgramResult'

  publicGameStateReplies:
    address: null
    description: | 
      Logical reply channel, not a Socket.IO room. 
      Delivered through the acknowledgement callback of game.getPublicGameState
    messages:
      publicGameStateResult:
        $ref: '#/components/messages/PublicGameStateResult'

  player:
    address: 'game:{gameId}:player:{playerId}'
    parameters:
      gameId:
        description: Game identifier
      playerId:
        description: Player identifier
    messages:
      cardsDealt:
        $ref: '#/components/messages/CardsDealt'

  public:
    address: 'game:{gameId}:public'
    parameters:
      gameId:
        description: Game identifier
    messages:
      programSubmitted:
        $ref: '#/components/messages/ProgramSubmitted'
      robotActionResolved:
        $ref: '#/components/messages/RobotActionResolved'
      phaseChanged:
        $ref: '#/components/messages/PhaseChanged'

  lobby:
    address: 'game:{gameId}:lobby'
    parameters:
      gameId:
        description: Game identifier

operations:
  receiveProgram:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/submitProgram'
    reply:
      channel:
        $ref: '#/channels/programReplies'
      messages:
        - $ref: '#/channels/programReplies/messages/programResult'
      x-socketio:
        acknowledgement: true

  sendPrivateEvents:
    action: send
    channel:
      $ref: '#/channels/player'

  broadcastGameEvents:
    action: send
    channel:
      $ref: '#/channels/public'
  
  handleGetGameState:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/getPublicGameState'
    reply:
      channel:
        $ref: '#/channels/publicGameStateReplies'
      messages:
        - $ref: '#/channels/publicGameStateReplies/messages/publicGameStateResult'
      x-socketio:
        acknowledgement: true

components:
  messages:
    SubmitProgram:
      name: program.submit
      payload:
        type: object
        additionalProperties: false
        required: [gameId, playerId, cardIds]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          playerId:
            $ref: '#/components/schemas/PlayerId'
          cardIds:
            type: array
            description: Card instance IDs in register order.
            minItems: 5
            maxItems: 5
            uniqueItems: true
            items:
              $ref: '#/components/schemas/CardId'

      description: |
        Submit once per round during PROGRAMMING. The service checks the assigned
        player and current programming phase before resolving five distinct cards from that
        player's hand. Rejection leaves accepted programs unchanged.
    CardsDealt:
      name: cards.dealt
      payload:
        type: object
        required: [gameId, playerId, cards]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          playerId:
            $ref: '#/components/schemas/PlayerId'
          cards:
            type: array
            items:
              $ref: '#/components/schemas/Card'

    ProgramResult:
      name: program.result
      payload:
        type: object
        required: [outcome]
        properties:
          outcome:
            type: string
            enum:
              - ACCEPTED
              - INVALID_PROGRAM

    ProgramSubmitted:
      name: program.submitted
      description: |
        After ACCEPTED, broadcast readiness to every game connection, including
        the submitter. Never disclose cards. This event does not start activation.
      payload:
        type: object
        required: [gameId, playerId]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          playerId:
            $ref: '#/components/schemas/PlayerId'

    PhaseChanged:
      name: game.phaseChanged
      description: |
        Broadcast once per transition. EXECUTING follows the final submission
        notification and precedes all actions. PROGRAMMING follows the last
        action, increments the round, and precedes private cards.dealt events.
        Clients finish queued playback before displaying programming or clearing
        registers, and wait for the matching hand before enabling input.
      payload:
        type: object
        additionalProperties: false
        required: [gameId, phase]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          phase:
            $ref: '#/components/schemas/GamePhase'

    RobotActionResolved:
      name: robot.actionResolved
      description: |
        One result per robot per register, including blocked moves. Send in
        register order, recalculating antenna priority after each robot acts.
        Clients preserve every result in playback; no animation acknowledgement
        or programming timer controls server progression.
      payload:
        type: object
        required:
          - gameId
          - registerIndex
          - robotId
          - instruction
          - position
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          registerIndex:
            type: integer
            minimum: 0
            maximum: 4
          robotId:
            $ref: '#/components/schemas/RobotId'
          instruction:
            $ref: '#/components/schemas/Instruction'
          position:
            $ref: '#/components/schemas/Position'

    GetPublicGameState:
      name: game.getPublicGameState
      payload:
        type: object
        additionalProperties: false
        required: [gameId]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'

    PublicGameStateResult:
      name: game.publicGameStateResult
      description: Result returned through the game.getPublicGameState acknowledgement.
      payload:
        oneOf:
          - $ref: '#/components/schemas/PublicGameStateFound'
          - $ref: '#/components/schemas/PublicGameStateNotFound'

  schemas:

    GamePhase:
      type: string
      enum: [PROGRAMMING, EXECUTING]

    Antenna:
      type: object
      additionalProperties: false
      required: [x, y, angle]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        angle:
          type: number
      description: |
        Fixed in-board coordinates and a finite angle in radians clockwise from
        east. The default is top centre, facing south: floor(width/2), 0, pi/2.
        It does not reserve a tile or introduce board effects.

    GameId:
      type: string
      format: uuid

    PlayerId:
      type: string
      format: uuid

    RobotId:
      type: string
      format: uuid

    CardId:
      type: string
      format: uuid

    Instruction:
      type: string
      enum: [MOVE_1, TURN_LEFT]

    Card:
      type: object
      required: [id, instruction]
      properties:
        id:
          $ref: '#/components/schemas/CardId'
          description: Unique card instance ID
        instruction:
          $ref: '#/components/schemas/Instruction'
      
    Orientation:
      type: string
      enum: [NORTH, EAST, SOUTH, WEST]

    Coordinate:
      type: object
      description: A board location without a facing direction.
      required: [x, y]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0

    Position:
      type: object
      required: [coordinate, orientation]
      properties:
        coordinate:
          $ref: '#/components/schemas/Coordinate'
        orientation:
          $ref: '#/components/schemas/Orientation'
    
    Robot:
      type: object
      required: [robotId, playerId, position]
      properties:
        robotId:
          $ref: '#/components/schemas/RobotId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        position:
          $ref: '#/components/schemas/Position'

    PublicGameState:
      type: object
      required: [gameId, antenna, board, robots, phase]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        antenna:
          $ref: '#/components/schemas/Antenna'
        board:
          $ref: '#/components/schemas/Board'
        robots:
          type: array
          items:
            $ref: '#/components/schemas/Robot'
        phase:
          $ref: '#/components/schemas/GamePhase'

    PublicGameStateFound:
      type: object
      additionalProperties: false
      required: [outcome, state]
      properties:
        outcome:
          type: string
          enum: [GAME_FOUND]
        state:
          $ref: '#/components/schemas/PublicGameState'

    PublicGameStateNotFound:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [GAME_NOT_FOUND]

    Board:
      type: object
      required: [width, height, tiles]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/Tile'

    Tile:
      type: object
      required: [position, type]
      properties:
        position:
          $ref: '#/components/schemas/Coordinate'
        type:
          type: string
          enum: [EMPTY]
        walls:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Orientation'
