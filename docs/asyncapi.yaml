asyncapi: 3.1.0

info:
  title: Game Service
  version: 0.5.0-draft
  description: |-
    This document describes RoboRally's client-server communication. No code change
    regarding communication should be made without updating this document.
    Server broadcast destinations represent Socket.IO rooms.
defaultContentType: application/json

channels:
  commands:
    address: commands
    description: inbound channel for messages/events emitted by the client; not a Socket.IO room.
    x-socketio:
      routing: client-to-server
    messages:
      listLobbies:
        $ref: '#/components/messages/LobbyList'
      createLobby:
        $ref: '#/components/messages/LobbyCreate'
      joinLobby:
        $ref: '#/components/messages/LobbyJoin'
      leaveLobby:
        $ref: '#/components/messages/LobbyLeave'
      startLobby:
        $ref: '#/components/messages/LobbyStart'
      getSession:
        $ref: '#/components/messages/SessionGet'
      login:
        $ref: '#/components/messages/Login'
      leaveGame:
        $ref: '#/components/messages/LeaveGame'
      submitProgram:
        $ref: '#/components/messages/SubmitProgram'
      updateRegisters:
        $ref: '#/components/messages/UpdateRegisters'

  lobbyListReplies:
    address: null
    description: Socket.IO acknowledgement of lobby.list.
    messages:
      result:
        $ref: '#/components/messages/LobbyListReply'

  lobbyCreateReplies:
    address: null
    description: Socket.IO acknowledgement of lobby.create.
    messages:
      result:
        $ref: '#/components/messages/LobbyCreateReply'

  lobbyJoinReplies:
    address: null
    description: Socket.IO acknowledgement of lobby.join.
    messages:
      result:
        $ref: '#/components/messages/LobbyJoinReply'

  lobbyLeaveReplies:
    address: null
    description: Socket.IO acknowledgement of lobby.leave.
    messages:
      result:
        $ref: '#/components/messages/LobbyLeaveReply'

  lobbyStartReplies:
    address: null
    description: Socket.IO acknowledgement of lobby.start.
    messages:
      result:
        $ref: '#/components/messages/LobbyStartReply'

  sessionGetReplies:
    address: null
    description: Socket.IO acknowledgement of session.get.
    messages:
      result:
        $ref: '#/components/messages/SessionGetReply'

  lobby:
    address: 'lobby:{lobbyId}'
    parameters:
      lobbyId:
        description: Waiting lobby identifier
    messages:
      updated:
        $ref: '#/components/messages/LobbyUpdated'

  loginReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of user.login
    messages:
      result:
        $ref: '#/components/messages/LoginResult'

  leaveReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of game.leave, not a separate event.
    messages:
      result:
        $ref: '#/components/messages/LeaveResult'

  programReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of program.submit
    messages:
      programResult:
        $ref: '#/components/messages/ProgramResult'

  updateRegistersReplies:
    address: null
    description: Delivered through the acknowledgement of game.updateRegisters.
    messages:
      result:
        $ref: '#/components/messages/UpdateRegistersResult'

  player:
    address: 'game:{gameId}:player:{playerId}'
    parameters:
      gameId:
        description: Game identifier
      playerId:
        description: Player identifier
    messages:
      gameStarted:
        $ref: '#/components/messages/GameStarted'
      cardsDealt:
        $ref: '#/components/messages/CardsDealt'

  public:
    address: 'game:{gameId}:public'
    parameters:
      gameId:
        description: Game identifier
    messages:
      programSubmitted:
        $ref: '#/components/messages/ProgramSubmitted'
      robotActionResolved:
        $ref: '#/components/messages/RobotActionResolved'
      registersChanged:
        $ref: '#/components/messages/RegistersChanged'
      programmingStarted:
        $ref: '#/components/messages/ProgrammingStarted'
      playerCheckpointProgress:
        $ref: '#/components/messages/PlayerCheckpointProgress'
      playerLeft:
        $ref: '#/components/messages/PlayerLeft'
      playerConnectionChanged:
        $ref: '#/components/messages/PlayerConnectionChanged'
      gameAborted:
        $ref: '#/components/messages/GameAborted'

operations:
  handleLogin:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/login'
    reply:
      channel:
        $ref: '#/channels/loginReplies'
      messages:
        - $ref: '#/channels/loginReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleLeaveGame:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/leaveGame'
    reply:
      channel:
        $ref: '#/channels/leaveReplies'
      messages:
        - $ref: '#/channels/leaveReplies/messages/result'
      x-socketio:
        acknowledgement: true

  receiveProgram:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/submitProgram'
    reply:
      channel:
        $ref: '#/channels/programReplies'
      messages:
        - $ref: '#/channels/programReplies/messages/programResult'
      x-socketio:
        acknowledgement: true

  handleUpdateRegisters:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/updateRegisters'
    reply:
      channel:
        $ref: '#/channels/updateRegistersReplies'
      messages:
        - $ref: '#/channels/updateRegistersReplies/messages/result'
      x-socketio:
        acknowledgement: true

  sendPrivateEvents:
    action: send
    channel:
      $ref: '#/channels/player'

  broadcastGameEvents:
    action: send
    channel:
      $ref: '#/channels/public'

  handleLobbyList:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/listLobbies'
    reply:
      channel:
        $ref: '#/channels/lobbyListReplies'
      messages:
        - $ref: '#/channels/lobbyListReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleLobbyCreate:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/createLobby'
    reply:
      channel:
        $ref: '#/channels/lobbyCreateReplies'
      messages:
        - $ref: '#/channels/lobbyCreateReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleLobbyJoin:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/joinLobby'
    reply:
      channel:
        $ref: '#/channels/lobbyJoinReplies'
      messages:
        - $ref: '#/channels/lobbyJoinReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleLobbyLeave:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/leaveLobby'
    reply:
      channel:
        $ref: '#/channels/lobbyLeaveReplies'
      messages:
        - $ref: '#/channels/lobbyLeaveReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleLobbyStart:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/startLobby'
    reply:
      channel:
        $ref: '#/channels/lobbyStartReplies'
      messages:
        - $ref: '#/channels/lobbyStartReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleSessionGet:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/getSession'
    reply:
      channel:
        $ref: '#/channels/sessionGetReplies'
      messages:
        - $ref: '#/channels/sessionGetReplies/messages/result'
      x-socketio:
        acknowledgement: true

  broadcastLobbyUpdates:
    action: send
    channel:
      $ref: '#/channels/lobby'

components:
  messages:
    LobbyList:
      name: lobby.list
      payload:
        $ref: '#/components/schemas/EmptyRequest'
    LobbyListReply:
      name: lobby.listResult
      description: Delivered only through the request acknowledgement.
      payload:
        $ref: '#/components/schemas/LobbyListResult'
    LobbyCreate:
      name: lobby.create
      payload:
        $ref: '#/components/schemas/EmptyRequest'
    LobbyCreateReply:
      name: lobby.createResult
      description: Delivered only through the request acknowledgement.
      payload:
        $ref: '#/components/schemas/LobbyJoinResult'
    LobbyJoin:
      name: lobby.join
      payload:
        $ref: '#/components/schemas/LobbyRequest'
    LobbyJoinReply:
      name: lobby.joinResult
      description: Delivered only through the request acknowledgement.
      payload:
        $ref: '#/components/schemas/LobbyJoinResult'
    LobbyLeave:
      name: lobby.leave
      payload:
        $ref: '#/components/schemas/LobbyRequest'
    LobbyLeaveReply:
      name: lobby.leaveResult
      description: Delivered only through the request acknowledgement.
      payload:
        $ref: '#/components/schemas/LobbyLeaveResult'
    LobbyStart:
      name: lobby.start
      payload:
        $ref: '#/components/schemas/LobbyRequest'
    LobbyStartReply:
      name: lobby.startResult
      description: Delivered only through the request acknowledgement.
      payload:
        $ref: '#/components/schemas/LobbyStartResult'
    SessionGet:
      name: session.get
      payload:
        $ref: '#/components/schemas/EmptyRequest'
    SessionGetReply:
      name: session.getResult
      description: Delivered only through the request acknowledgement.
      payload:
        $ref: '#/components/schemas/SessionResult'
    LobbyUpdated:
      name: lobby.updated
      payload:
        $ref: '#/components/schemas/LobbyUpdated'
    GameStarted:
      name: game.started
      payload:
        $ref: '#/components/schemas/GameStarted'
      description: Initializes the player with their assignment, public state including every player's registers, private hand, and submission status.
      examples:
        - name: started
          summary: One-tile illustrative board; normal initial hand
          payload:
            lobbyId: 00000000-0000-4000-8000-000000000005
            initialization:
              outcome: JOINED
              assignment:
                gameId: 00000000-0000-4000-8000-000000000001
                playerId: 00000000-0000-4000-8000-000000000002
                robotId: 00000000-0000-4000-8000-000000000003
              state:
                gameId: 00000000-0000-4000-8000-000000000001
                checkpointCount: 0
                board:
                  width: 1
                  height: 1
                  tiles:
                    - position:
                        x: 0
                        y: 0
                      type: EMPTY
                robots:
                  - robotId: 00000000-0000-4000-8000-000000000003
                    playerId: 00000000-0000-4000-8000-000000000002
                    colour: red
                    position:
                      coordinate:
                        x: 0
                        y: 0
                      orientation: NORTH
                phase: PROGRAMMING
                antenna:
                  x: 0
                  y: 0
                  angle: 1.5707963267948966
                players:
                  - playerId: 00000000-0000-4000-8000-000000000002
                    username: Dane
                    lastCheckpoint: 0
                    programSubmitted: false
                    connected: true
                    registers:
                      - status: EMPTY
                      - status: EMPTY
                      - status: EMPTY
                      - status: EMPTY
                      - status: EMPTY
                paused: false
                aborted: false
              hand:
                - id: 00000000-0000-4000-8000-000000000101
                  instruction: MOVE_1
                - id: 00000000-0000-4000-8000-000000000102
                  instruction: MOVE_2
                - id: 00000000-0000-4000-8000-000000000103
                  instruction: MOVE_3
                - id: 00000000-0000-4000-8000-000000000104
                  instruction: BACK_UP
                - id: 00000000-0000-4000-8000-000000000105
                  instruction: TURN_LEFT
                - id: 00000000-0000-4000-8000-000000000106
                  instruction: TURN_RIGHT
                - id: 00000000-0000-4000-8000-000000000107
                  instruction: U_TURN
                - id: 00000000-0000-4000-8000-000000000108
                  instruction: MOVE_1
                - id: 00000000-0000-4000-8000-000000000109
                  instruction: TURN_LEFT
              programSubmitted: false

    Login:
      name: user.login
      description: Requests a user identity for a username.
      payload:
        $ref: '#/components/schemas/Login'

      examples:
        - name: "username"
          summary: "Exact username, no normalization"
          payload:
            username: "Dane"

    LoginResult:
      name: user.loginResult
      description: Returns an approved user identity or a rejection.
      payload:
        $ref: '#/components/schemas/LoginResult'

      examples:
        - name: "loggedIn"
          summary: "Same shape for new and existing users"
          payload:
            outcome: "LOGGED_IN"
            user:
              userId: "00000000-0000-4000-8000-000000000004"
              username: "Dane"
        - name: "invalidUsername"
          summary: "Empty or overlong username"
          payload:
            outcome: "INVALID_USERNAME"

    LeaveGame:
      name: game.leave
      description: >-
        Requests explicit departure for the membership owned by this connection.
        On success, removes the player and robot, frees the occupied tile, and
        removes the connection from the public and private player rooms while
        retaining login. Disconnecting retains membership and does not send
        game.playerLeft. Leaving does not reopen a game that has already started.
      payload:
        $ref: '#/components/schemas/JoinGame'
      examples:
        - name: leave
          summary: Explicitly leave the assigned game
          payload:
            gameId: 00000000-0000-4000-8000-000000000001

    LeaveResult:
      name: game.leaveResult
      description: >-
        Acknowledges game.leave with LEFT or a rejection. This is returned through
        the request's acknowledgement callback, not emitted as game.leaveResult.
      payload:
        $ref: '#/components/schemas/LeaveResult'
      examples:
        - name: left
          summary: Membership removed; the connection remains logged in
          payload:
            outcome: LEFT
        - name: loginRequired
          summary: The connection has not logged in
          payload:
            outcome: LOGIN_REQUIRED
        - name: invalidRequest
          summary: The request is malformed
          payload:
            outcome: INVALID_REQUEST
        - name: gameNotFound
          summary: Game unavailable or membership not owned by this connection
          payload:
            outcome: GAME_NOT_FOUND
        - name: internalError
          summary: Unexpected service failure
          payload:
            outcome: INTERNAL_ERROR

    PlayerLeft:
      name: game.playerLeft
      description: >-
        Broadcasts the removed player and robot identifiers to remaining members
        in game:{gameId}:public after a successful explicit leave. The leaving
        connection loses public and private room access before LEFT is
        acknowledged and does not receive this broadcast. Recipients remove the
        player and robot from their public state. Disconnecting does not emit
        this event.
      payload:
        $ref: '#/components/schemas/PlayerLeft'
      examples:
        - name: playerLeft
          summary: Remove the departing player and robot from public state
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            robotId: 00000000-0000-4000-8000-000000000003

    SubmitProgram:
      name: program.submit
      payload:
        type: object
        additionalProperties: false
        required:
          - gameId
          - playerId
          - cardIds
        properties:
          gameId:
            $ref: "#/components/schemas/GameId"
          playerId:
            $ref: "#/components/schemas/PlayerId"
          cardIds:
            type: array
            description: Card instance IDs in register order.
            minItems: 5
            maxItems: 5
            uniqueItems: true
            items:
              $ref: "#/components/schemas/CardId"
      description: >-
        Submits five cards in register order for the connection-owned player.
      examples:
        - name: submit
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            cardIds:
              - 00000000-0000-4000-8000-000000000101
              - 00000000-0000-4000-8000-000000000102
              - 00000000-0000-4000-8000-000000000103
              - 00000000-0000-4000-8000-000000000104
              - 00000000-0000-4000-8000-000000000105

    ProgramResult:
      name: program.result
      payload:
        type: object
        required: [ outcome ]
        properties:
          outcome:
            type: string
            enum:
              - ACCEPTED
              - INVALID_PROGRAM
              - GAME_PAUSED
              - GAME_ABORTED
              - ALREADY_SUBMITTED
              - WRONG_PHASE
              - NOT_A_MEMBER
              - INVALID_REQUEST
              - GAME_ID_MISMATCH
              - PLAYER_ID_MISMATCH
              - PLAYER_NOT_IN_GAME
              - INTERNAL_ERROR
      description: |
        ACCEPTED: the program was stored.
        INVALID_PROGRAM: the cards did not match the player's hand, or did not cover all five registers.
        GAME_PAUSED: rejected because the game is paused.
        GAME_ABORTED: rejected because the game has stopped irrecoverably after an unexpected service failure.
        ALREADY_SUBMITTED: this player already has a stored program for the current round; it is unchanged.
        WRONG_PHASE: the round had already moved into activation before this submission arrived.
        NOT_A_MEMBER: this connection does not own a membership for this game.
        INVALID_REQUEST: the request did not match the expected shape.
        GAME_ID_MISMATCH: the request's gameId did not match the connection's game.
        PLAYER_ID_MISMATCH: the request's playerId did not match the connection's own player.
        PLAYER_NOT_IN_GAME: the player is no longer part of the game (left or otherwise removed).
        INTERNAL_ERROR: unexpected service failure.
        No acknowledgement means the outcome is unknown.

    ProgramSubmitted:
      name: program.submitted
      description: >-
        Event signaling another player has submitted their program.
      payload:
        type: object
        required:
          - playerId
          - gameId
        properties:
          playerId:
            $ref: "#/components/schemas/PlayerId"
          gameId:
            $ref: "#/components/schemas/GameId"
      examples:
        - name: ready
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002

    UpdateRegisters:
      name: game.updateRegisters
      description: Updates a player's register occupancy and returns an acknowledgement outcome.
      payload:
        type: object
        additionalProperties: false
        required: [ gameId, playerId, occupied ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          playerId:
            $ref: '#/components/schemas/PlayerId'
          occupied:
            type: array
            minItems: 5
            maxItems: 5
            items:
              type: boolean
            description: 'Five occupancy flags in register order: true is HIDDEN; false is EMPTY.'
      examples:
        - name: partiallyOccupied
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            occupied: [ true, false, true, false, false ]

    UpdateRegistersResult:
      name: game.updateRegistersResult
      description: Acknowledges a register occupancy update with ACCEPTED or a rejection.
      payload:
        type: object
        additionalProperties: false
        required: [ outcome ]
        properties:
          outcome:
            type: string
            enum: [ ACCEPTED, INVALID_REQUEST, NOT_A_MEMBER, PLAYER_ID_MISMATCH, WRONG_PHASE, ALREADY_SUBMITTED, INTERNAL_ERROR ]
      examples:
        - name: accepted
          payload:
            outcome: ACCEPTED

    RegistersChanged:
      name: game.registersChanged
      description: Broadcasts a player's register occupancy during programming.
      payload:
        $ref: '#/components/schemas/RegistersChanged'
      examples:
        - name: occupancyChanged
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            registers:
              - status: HIDDEN
              - status: EMPTY
              - status: HIDDEN
              - status: EMPTY
              - status: EMPTY
        - name: occupancyCleared
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            registers:
              - status: EMPTY
              - status: EMPTY
              - status: EMPTY
              - status: EMPTY
              - status: EMPTY

    ProgrammingStarted:
      name: game.programmingStarted
      description: Announces the start of programming with all players' registers reset to EMPTY.
      payload:
        type: object
        additionalProperties: false
        required: [ gameId ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
      examples:
        - name: started
          payload:
            gameId: 00000000-0000-4000-8000-000000000001

    RobotActionResolved:
      name: robot.actionResolved
      payload:
        type: object
        required:
          - robotId
          - playerId
          - instruction
          - position
          - gameId
          - registerIndex
          - pushedRobots
        properties:
          robotId:
            $ref: "#/components/schemas/RobotId"
          playerId:
            $ref: "#/components/schemas/PlayerId"
          instruction:
            $ref: "#/components/schemas/Instruction"
          position:
            $ref: "#/components/schemas/Position"
          pushedRobots:
            type: array
            description: Final states of other robots displaced by this instruction, after all movement steps and reboots. Empty when no other robot changed position.
            items:
              type: object
              required: [robotId, position]
              properties:
                robotId:
                  $ref: "#/components/schemas/RobotId"
                position:
                  $ref: "#/components/schemas/Position"
          gameId:
            $ref: "#/components/schemas/GameId"
          registerIndex:
            type: integer
            minimum: 0
            maximum: 4
            description: Zero-based register index; display 1–5. Multiple robot actions can share one index.
      description: >-
        Reports the resulting robot state after one programmed instruction.
        position and pushedRobots are authoritative after any pit or board-edge
        reboots. Apply them together as one action. Reboots complete before this
        event and before selecting the next robot by antenna priority.
      examples:
        - name: firstRegister
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            registerIndex: 0
            robotId: 00000000-0000-4000-8000-000000000003
            playerId: 00000000-0000-4000-8000-000000000002
            instruction: MOVE_1
            pushedRobots: []
            position:
              coordinate:
                x: 10
                y: 6
              orientation: NORTH

    PlayerCheckpointProgress:
      name: player.checkpointProgress
      description: >-
        Broadcasts changed player checkpoint progress to game:{gameId}:public after the
        related robot.actionResolved, or game.playerLeft when a departure finishes a
        register, and before subsequent actions or private hands. Unchanged progress
        produces no event. Clients apply progress on receipt without changing movement
        playback or programming availability. Replayed events must not reduce progress.
      payload:
        type: object
        additionalProperties: false
        required: [ gameId, playerId, lastCheckpoint, checkpointCount ]
        properties:
          gameId:
            $ref: '#/components/schemas/GameId'
          playerId:
            $ref: '#/components/schemas/PlayerId'
          lastCheckpoint:
            $ref: '#/components/schemas/LastCheckpoint'
          checkpointCount:
            $ref: '#/components/schemas/CheckpointCount'
      examples:
        - name: firstCheckpoint
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            lastCheckpoint: 1
            checkpointCount: 2

    CardsDealt:
      name: cards.dealt
      payload:
        type: object
        required:
          - cards
          - gameId
          - playerId
        properties:
          cards:
            type: array
            items:
              $ref: "#/components/schemas/Card"
          gameId:
            $ref: "#/components/schemas/GameId"
          playerId:
            $ref: "#/components/schemas/PlayerId"
      description: >-
        Private hand dealt to the named player for a programming round.
      examples:
        - name: nextHand
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            cards:
              - id: 00000000-0000-4000-8000-000000000101
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000102
                instruction: MOVE_2
              - id: 00000000-0000-4000-8000-000000000103
                instruction: MOVE_3
              - id: 00000000-0000-4000-8000-000000000104
                instruction: BACK_UP
              - id: 00000000-0000-4000-8000-000000000105
                instruction: TURN_LEFT
              - id: 00000000-0000-4000-8000-000000000106
                instruction: TURN_RIGHT
              - id: 00000000-0000-4000-8000-000000000107
                instruction: U_TURN
              - id: 00000000-0000-4000-8000-000000000108
                instruction: MOVE_1
              - id: 00000000-0000-4000-8000-000000000109
                instruction: TURN_LEFT

    PlayerConnectionChanged:
      name: game.playerConnectionChanged
      description: >-
        Announces an existing player's connection status and the resulting
        game pause state. 
      payload:
        $ref: '#/components/schemas/PlayerConnectionChanged'
      examples:
        - name: disconnected
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: false
            paused: true
        - name: reconnectedWhileAnotherPlayerIsDisconnected
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: true
            paused: true
        - name: reconnectedAndGameResumed
          payload:
            gameId: 00000000-0000-4000-8000-000000000001
            playerId: 00000000-0000-4000-8000-000000000002
            connected: true
            paused: false

    GameAborted:
      name: game.aborted
      description: >-
        Announces that gameplay has stopped irrecoverably after an unexpected service failure. 
      payload:
        $ref: '#/components/schemas/GameAborted'
      examples:
        - name: aborted
          payload:
            gameId: 00000000-0000-4000-8000-000000000001

  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    LobbyRequest:
      type: object
      additionalProperties: false
      required:
        - lobbyId
      properties:
        lobbyId:
          type: string
          format: uuid
    LobbySummary:
      type: object
      additionalProperties: false
      required:
        - lobbyId
        - name
        - playerCount
        - maxPlayers
      properties:
        lobbyId:
          type: string
          format: uuid
        name:
          type: string
        playerCount:
          type: integer
          minimum: 0
        maxPlayers:
          type: integer
          minimum: 1
    LobbyState:
      type: object
      additionalProperties: false
      examples:
        - lobbyId: 00000000-0000-4000-8000-000000000001
          name: Lobby 1
          playerCount: 1
          maxPlayers: 6
          ownerUserId: 00000000-0000-4000-8000-000000000004
          players:
            - userId: 00000000-0000-4000-8000-000000000004
              username: Dane
      required:
        - lobbyId
        - name
        - playerCount
        - maxPlayers
        - ownerUserId
        - players
      properties:
        lobbyId:
          type: string
          format: uuid
        name:
          type: string
        playerCount:
          type: integer
          minimum: 0
        maxPlayers:
          type: integer
          minimum: 1
        ownerUserId:
          type: string
          format: uuid
        players:
          type: array
          description: Members in join order, with unique userIds. Length equals playerCount; ownerUserId identifies the first member.
          minItems: 1
          items:
            $ref: '#/components/schemas/User'
    LobbyFailure:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          enum:
            - LOGIN_REQUIRED
            - INVALID_REQUEST
            - INTERNAL_ERROR
            - LOBBY_NOT_FOUND
            - NOT_LOBBY_MEMBER
            - NOT_LOBBY_OWNER
            - LOBBY_FULL
            - USER_ALREADY_IN_SESSION
    LobbyListResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - outcome
            - lobbies
          properties:
            outcome:
              const: LOBBIES_FOUND
            lobbies:
              type: array
              items:
                $ref: '#/components/schemas/LobbySummary'
        - $ref: '#/components/schemas/LobbyFailure'
    LobbyJoinResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - outcome
            - lobby
          properties:
            outcome:
              const: LOBBY_JOINED
            lobby:
              $ref: '#/components/schemas/LobbyState'
        - $ref: '#/components/schemas/LobbyFailure'
    LobbyLeaveResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - outcome
          properties:
            outcome:
              const: LEFT
        - $ref: '#/components/schemas/LobbyFailure'
    LobbyStartResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - outcome
            - gameId
          properties:
            outcome:
              const: STARTED
            gameId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          description: A listed player disconnected before Start. Remain in the lobby and retry.
          required:
            - outcome
          properties:
            outcome:
              const: LOBBY_MEMBER_DISCONNECTED
        - $ref: '#/components/schemas/LobbyFailure'
    SessionResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - outcome
          properties:
            outcome:
              const: NO_SESSION
        - type: object
          additionalProperties: false
          required:
            - outcome
            - lobby
          properties:
            outcome:
              const: IN_LOBBY
            lobby:
              $ref: '#/components/schemas/LobbyState'
        - type: object
          additionalProperties: false
          required:
            - outcome
            - initialization
          properties:
            outcome:
              const: IN_GAME
            initialization:
              $ref: '#/components/schemas/JoinAccepted'
        - $ref: '#/components/schemas/LobbyFailure'
    LobbyUpdated:
      type: object
      additionalProperties: false
      description: Full lobby snapshot sent to existing members after a join and to remaining members after a leave or disconnect.
      required:
        - lobby
      properties:
        lobby:
          $ref: '#/components/schemas/LobbyState'
    GameStarted:
      type: object
      additionalProperties: false
      required:
        - lobbyId
        - initialization
      properties:
        lobbyId:
          type: string
          format: uuid
        initialization:
          $ref: '#/components/schemas/JoinAccepted'

    # Login
    Username:
      type: string
      minLength: 1
      maxLength: 30
      description: |
        Username length is measured in Unicode code points. Whitespace and case are preserved; no normalization is applied yet.

    User:
      type: object
      additionalProperties: false
      required: [ userId, username ]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        username:
          $ref: '#/components/schemas/Username'

    Login:
      type: object
      additionalProperties: false
      required: [ username ]
      properties:
        username:
          $ref: '#/components/schemas/Username'

    LoginResult:
      oneOf:
        - $ref: '#/components/schemas/LoginAccepted'
        - $ref: '#/components/schemas/LoginRejected'

    LoginAccepted:
      type: object
      additionalProperties: false
      required: [ outcome, user ]
      properties:
        outcome:
          type: string
          enum: [ LOGGED_IN ]
        user:
          $ref: '#/components/schemas/User'

    LoginRejected:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ INVALID_USERNAME, INVALID_REQUEST, ALREADY_LOGGED_IN, INTERNAL_ERROR ]
      description: |
        INVALID_USERNAME covers a missing/non-string username or a length outside 1–30.
        INVALID_REQUEST: the request did not match the expected shape.
        ALREADY_LOGGED_IN means this connection is bound to a different username.
        Repeating login with the same username returns LOGGED_IN with the same user.
        INTERNAL_ERROR is an unexpected service failure; do not expose internals.

    # Membership
    JoinGame:
      type: object
      additionalProperties: false
      required: [ gameId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'

    PlayerAssignment:
      type: object
      additionalProperties: false
      required: [ gameId, playerId, robotId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        robotId:
          $ref: '#/components/schemas/RobotId'

    JoinAccepted:
      type: object
      additionalProperties: false
      required:
        - outcome
        - assignment
        - state
        - hand
        - programSubmitted
      properties:
        outcome:
          type: string
          enum:
            - JOINED
        assignment:
          $ref: "#/components/schemas/PlayerAssignment"
        state:
          $ref: "#/components/schemas/PublicGameState"
        hand:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: The player's current private hand.

        programSubmitted:
          type: boolean
          description: Whether this player has submitted for the current round.
      description:  Private initialization in game.started or session.get; reconnecting preserves the assignment.

    LeaveResult:
      type: object
      additionalProperties: false
      required: [ outcome ]
      properties:
        outcome:
          type: string
          enum: [ LEFT, LOGIN_REQUIRED, INVALID_REQUEST, GAME_NOT_FOUND, INTERNAL_ERROR ]
      description: |
        LEFT: membership and robot removed, room access revoked, login retained.
        LOGIN_REQUIRED: this connection has no approved user.
        INVALID_REQUEST: the request did not match the expected shape.
        GAME_NOT_FOUND: unavailable game or membership not owned by this connection;
        this also covers a repeated leave after a successful departure.
        INTERNAL_ERROR: unexpected service failure; do not expose internals.

    PlayerLeft:
      type: object
      additionalProperties: false
      required: [ gameId, playerId, robotId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        robotId:
          $ref: '#/components/schemas/RobotId'

    PlayerState:
      type: object
      additionalProperties: false
      required:
        - playerId
        - username
        - programSubmitted
        - connected
        - lastCheckpoint
        - registers
      properties:
        playerId:
          $ref: "#/components/schemas/PlayerId"
        username:
          $ref: "#/components/schemas/Username"
        programSubmitted:
          type: boolean
        connected:
          type: boolean
        lastCheckpoint:
          $ref: '#/components/schemas/LastCheckpoint'
        registers:
          $ref: '#/components/schemas/PublicRegisters'
      description: >-
        Public participation and submission status; never contains cards.

    RegistersChanged:
      type: object
      additionalProperties: false
      required: [ gameId, playerId, registers ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        registers:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [ status ]
            properties:
              status:
                type: string
                enum: [ EMPTY, HIDDEN ]
          description: Occupancy-only slots after an accepted update; revealed instructions arrive through robot.actionResolved.

    PublicRegisters:
      type: array
      minItems: 5
      maxItems: 5
      items:
        $ref: '#/components/schemas/PublicRegisterSlot'
      description: Five public slots in register order.

    PublicRegisterSlot:
      type: object
      additionalProperties: false
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ EMPTY, HIDDEN, REVEALED ]
        instruction:
          $ref: '#/components/schemas/Instruction'
      if:
        properties:
          status:
            const: REVEALED
      then:
        required: [ instruction ]
      else:
        not:
          required: [ instruction ]
      description: >-
        One register slot in register order. EMPTY and HIDDEN carry only their status;
        REVEALED carries the executed instruction.

    PublicGameState:
      description: >-
        Public board, robot, player, phase, and antenna state for a game.
        Robot positions include any completed pit reboot.
      type: object
      required:
        - gameId
        - board
        - antenna
        - players
        - robots
        - phase
        - paused
        - aborted
        - checkpointCount
      properties:
        gameId:
          $ref: "#/components/schemas/GameId"
        board:
          $ref: "#/components/schemas/Board"
        robots:
          type: array
          items:
            $ref: "#/components/schemas/Robot"
        phase:
          $ref: "#/components/schemas/GamePhase"
        antenna:
          $ref: "#/components/schemas/Antenna"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerState"
        paused:
          type: boolean
          description: Whether gameplay is paused because a game member is disconnected.
        aborted:
          type: boolean
          description: Whether gameplay has stopped irrecoverably after an unexpected service failure.
        checkpointCount:
          $ref: '#/components/schemas/CheckpointCount'

    LastCheckpoint:
      type: integer
      minimum: 0
      description: >-
        Last checkpoint completed by the player in numerical order, initially 0.
        Must not exceed checkpointCount. Persists across rounds and reconnections.
        Completing the final checkpoint does not end the game.

    CheckpointCount:
      type: integer
      minimum: 0
      description: Total number of checkpoints on the board; 0 on a board without checkpoints.

    GamePhase:
      type: string
      enum:
        - PROGRAMMING
        - EXECUTING
      description: EXECUTING means domain activation. No lobby/WAITING phase.

    # Shared types
    UserId:
      type: string
      format: uuid
      description: Opaque service-issued user identifier.

    GameId:
      type: string
      format: uuid

    PlayerId:
      type: string
      format: uuid

    RobotId:
      type: string
      format: uuid

    CardId:
      type: string
      format: uuid

    Instruction:
      type: string
      enum: [ MOVE_1, MOVE_2, MOVE_3, BACK_UP, TURN_LEFT, TURN_RIGHT, U_TURN ]

    Card:
      type: object
      required: [ id, instruction ]
      properties:
        id:
          $ref: '#/components/schemas/CardId'
          description: Unique card instance ID
        instruction:
          $ref: '#/components/schemas/Instruction'

    Orientation:
      type: string
      enum: [ NORTH, EAST, SOUTH, WEST ]

    Coordinate:
      type: object
      description: A board location without a facing direction.
      required: [ x, y ]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0

    Position:
      type: object
      required: [ coordinate, orientation ]
      properties:
        coordinate:
          $ref: '#/components/schemas/Coordinate'
        orientation:
          $ref: '#/components/schemas/Orientation'

    Robot:
      type: object
      required: [ robotId, playerId, colour, position ]
      properties:
        robotId:
          $ref: '#/components/schemas/RobotId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        colour:
          type: string
          description: Server-assigned colour, fixed for the lifetime of this robot.
        position:
          $ref: '#/components/schemas/Position'

    Board:
      type: object
      required: [ width, height, tiles ]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/Tile'

    Tile:
      type: object
      required: [ position, type ]
      properties:
        position:
          $ref: '#/components/schemas/Coordinate'
        type:
          type: string
          enum: [ EMPTY, PIT ]
          description: >-
            PIT triggers an immediate server-side reboot on entry during movement,
            discarding the remaining steps of that instruction. Walls can block entry.
        walls:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Orientation'
        checkpointNumber:
          type: integer
          minimum: 1
          description: >-
            Optional checkpoint on an EMPTY tile, independent of its walls.
            Omit when absent. Numbers are unique and consecutive from 1 on a board.
            Checkpoints stay at their fixed positions and are available to every player.
    Antenna:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - angle
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        angle:
          type: number
      description: >-
        Fixed game configuration. Coordinates must be on the board. Angle is radians clockwise from
        east (south is pi/2), matching the documented priority algorithm. Does not occupy a robot
        slot or add board effects. The current 21×15 test board uses x=10, y=0, angle=pi/2 (south).
        For other widths use floor(width/2), y=0, facing south; keep configuration fixed per game.

    PlayerConnectionChanged:
      type: object
      additionalProperties: false
      required:
        - gameId
        - playerId
        - connected
        - paused
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        playerId:
          $ref: '#/components/schemas/PlayerId'
        connected:
          type: boolean
          description: The player's connection status after this change.
        paused:
          type: boolean
          description: Whether any game member remains disconnected after this change.

    GameAborted:
      type: object
      additionalProperties: false
      required: [ gameId ]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
