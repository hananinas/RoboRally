asyncapi: 3.1.0

info:
  title: Game Service 
  version: 0.0.0
  description: |
    Server API. Each Socket.IO event carries one JSON payload.
    Message name = Socket.IO event name.
    Room channel address = server broadcast destination.
    Commands are emitted directly to the server.
defaultContentType: application/json


channels:
  commands:
    address: commands
    description: inbound channel for messages/events emitted by the client; not a Socket.IO room.
    x-socketio:
      routing: client-to-server
    messages:
      submitProgram:
        $ref: '#/components/messages/SubmitProgram'
      getPublicGameState:
        $ref: '#/components/messages/GetPublicGameState'

  programReplies:
    address: null
    description: |
      Logical reply channel, not a Socket.IO room. 
      Delivered through the acknowledgement callback of program.submit.
    messages:
      programResult:
        $ref: '#/components/messages/ProgramResult'

  publicGameStateReplies:
    address: null
    description: | 
      Logical reply channel, not a Socket.IO room. 
      Delivered through the acknowledgement callback of game.getPublicGameState
    messages:
      publicGameStateResult:
        $ref: '#/components/messages/PublicGameStateResult'

  player:
    address: 'game:{gameId}:player:{playerId}'
    parameters:
      gameId:
        description: Game identifier
      playerId:
        description: Player identifier
    messages:
      cardsDealt:
        $ref: '#/components/messages/CardsDealt'

  public:
    address: 'game:{gameId}:public'
    parameters:
      gameId:
        description: Game identifier
    messages:
      programSubmitted:
        $ref: '#/components/messages/ProgramSubmitted'
      robotActionResolved:
        $ref: '#/components/messages/RobotActionResolved'

  lobby:
    address: 'game:{gameId}:lobby'
    parameters:
      gameId:
        description: Game identifier

operations:
  receiveProgram:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/submitProgram'
    reply:
      channel:
        $ref: '#/channels/programReplies'
      messages:
        - $ref: '#/channels/programReplies/messages/programResult'
      x-socketio:
        acknowledgement: true

  sendPrivateEvents:
    action: send
    channel:
      $ref: '#/channels/player'

  broadcastGameEvents:
    action: send
    channel:
      $ref: '#/channels/public'
  
  handleGetGameState:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/getPublicGameState'
    reply:
      channel:
        $ref: '#/channels/publicGameStateReplies'
      messages:
        - $ref: '#/channels/publicGameStateReplies/messages/publicGameStateResult'
      x-socketio:
        acknowledgement: true

components:
  messages:
    SubmitProgram:
      name: program.submit
      payload:
        type: object
        additionalProperties: false
        required: [gameId, cardIds]
        properties:
          gameId:
            type: string
            format: uuid
          cardIds:
            type: array
            description: Card instance IDs in register order.
            minItems: 5
            maxItems: 5
            uniqueItems: true
            items:
              type: string
              format: uuid

    CardsDealt:
      name: cards.dealt
      payload:
        type: object
        required: [cards]
        properties:
          cards:
            type: array
            items:
              $ref: '#/components/schemas/Card'

    ProgramResult:
      name: program.result
      payload:
        type: object
        required: [outcome]
        properties:
          outcome:
            type: string
            enum:
              - ACCEPTED
              - INVALID_PROGRAM

    ProgramSubmitted:
      name: program.submitted
      description: Reveals readiness, never the submitted cards.
      payload:
        type: object
        required: [playerId]
        properties:
          playerId:
            type: string

    RobotActionResolved:
      name: robot.actionResolved
      payload:
        type: object
        required:
          - robotId
          - instruction
          - position
        properties:
          robotId:
            type: string
            format: uuid
          instruction:
            $ref: '#/components/schemas/Instruction'
          position:
            $ref: '#/components/schemas/Position'

    GetPublicGameState:
      name: game.getPublicGameState
      payload:
        type: object
        required: [gameId]
        properties:
          gameId:
            type: string

    PublicGameStateResult:
      name: game.publicGameStateResult
      description: Public game snapshot returned through an acknowledgement.
      payload:
        $ref: '#/components/schemas/PublicGameState'

  schemas:
    Instruction:
      type: string
      enum: [MOVE_1, TURN_LEFT]

    Card:
      type: object
      required: [id, instruction]
      properties:
        id:
          type: string
          format: uuid
          description: Unique card instance ID
        instruction:
          $ref: '#/components/schemas/Instruction'
      
    Orientation:
      type: string
      enum: [NORTH, EAST, SOUTH, WEST]

    Coordinate:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0

    Position:
      allOf:
        - $ref: '#/components/schemas/Coordinate'
        - type: object
          required: [orientation]
          properties:
            orientation:
              $ref: '#/components/schemas/Orientation'
    
    Robot:
      type: object
      required: [robotId, playerId, position]
      properties:
        robotId:
              type: string
        playerId:
          type: string
        position:
          $ref: '#/components/schemas/Position' 

    PublicGameState:
      type: object
      required: [gameId, board, robots, phase]
      properties:
        gameId:
          type: string
        board:
          $ref: '#/components/schemas/Board'
        robots:
          type: array
          items:
            $ref: '#/components/schemas/Robot'
        phase:
          type: string
          enum: [WAITING, PROGRAMMING, EXECUTING]

    Board:
      type: object
      required: [width, height, tiles]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/Tile'

    Tile:
      type: object
      required: [position, type]
      properties:
        position:
          $ref: '#/components/schemas/Coordinate'
        type:
          type: string
          enum: [EMPTY]
        walls:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Orientation'
