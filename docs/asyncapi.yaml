asyncapi: 3.1.0

info:
  title: Game Service
  version: 0.5.0-draft
  description: |-
    This document describes RoboRally's client-server communication. No code change
    regarding communication should be made without updating this document.
    Server broadcast destinations represent Socket.IO rooms.
defaultContentType: application/json

channels:
  commands:
    address: commands
    description: inbound channel for messages/events emitted by the client; not a Socket.IO room.
    x-socketio:
      routing: client-to-server
    messages:
      login:
        $ref: '#/components/messages/Login'
      listLobbies:
        $ref: '#/components/messages/ListLobbies'
      createLobby:
        $ref: '#/components/messages/CreateLobby'
      joinLobby:
        $ref: '#/components/messages/JoinLobby'
      leaveLobby:
        $ref: '#/components/messages/LeaveLobby'
      joinGame:
        $ref: '#/components/messages/JoinGame'
      submitProgram:
        $ref: '#/components/messages/SubmitProgram'
      getPublicGameState:
        $ref: '#/components/messages/GetPublicGameState'

  loginReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of user.login
    messages:
      result:
        $ref: '#/components/messages/LoginResult'

  lobbyListReplies:
    address: null
    description: Delivered through the acknowledgement of lobby.list.
    messages:
      result:
        $ref: '#/components/messages/LobbyListResult'

  lobbyCreateReplies:
    address: null
    description: Delivered through the acknowledgement of lobby.create.
    messages:
      result:
        $ref: '#/components/messages/LobbyCreateResult'

  lobbyJoinReplies:
    address: null
    description: Delivered through the acknowledgement of lobby.join.
    messages:
      result:
        $ref: '#/components/messages/LobbyJoinResult'

  lobbyLeaveReplies:
    address: null
    description: Delivered through the acknowledgement of lobby.leave.
    messages:
      result:
        $ref: '#/components/messages/LobbyLeaveResult'

  joinReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of game.join
    messages:
      result:
        $ref: '#/components/messages/JoinResult'

  programReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of program.submit
    messages:
      programResult:
        $ref: '#/components/messages/ProgramResult'

  publicGameStateReplies:
    address: null
    description: |
      Logical reply channel
      Delivered through the acknowledgement of game.getPublicGameState
    messages:
      publicGameStateResult:
        $ref: '#/components/messages/PublicGameStateResult'

  lobbyDirectory:
    address: null
    description: Global lobby directory broadcasts for connected clients.
    messages:
      listUpdated:
        $ref: '#/components/messages/LobbyListUpdated'

  lobby:
    address: 'lobby:{lobbyId}'
    parameters:
      lobbyId:
        description: Opaque lobby identifier.
    messages:
      updated:
        $ref: '#/components/messages/LobbyUpdated'
      started:
        $ref: '#/components/messages/LobbyStarted'

  player:
    address: 'game:{gameId}:player:{playerId}'
    parameters:
      gameId:
        description: Game identifier
      playerId:
        description: Player identifier
    messages:
      cardsDealt:
        $ref: '#/components/messages/CardsDealt'

  public:
    address: 'game:{gameId}:public'
    parameters:
      gameId:
        description: Game identifier
    messages:
      programSubmitted:
        $ref: '#/components/messages/ProgramSubmitted'
      robotActionResolved:
        $ref: '#/components/messages/RobotActionResolved'
      playerJoined:
        $ref: '#/components/messages/PlayerJoined'
      playerConnectionChanged:
        $ref: '#/components/messages/PlayerConnectionChanged'

operations:
  handleLogin:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/login'
    reply:
      channel:
        $ref: '#/channels/loginReplies'
      messages:
        - $ref: '#/channels/loginReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleListLobbies:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/listLobbies'
    reply:
      channel:
        $ref: '#/channels/lobbyListReplies'
      messages:
        - $ref: '#/channels/lobbyListReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleCreateLobby:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/createLobby'
    reply:
      channel:
        $ref: '#/channels/lobbyCreateReplies'
      messages:
        - $ref: '#/channels/lobbyCreateReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleJoinLobby:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/joinLobby'
    reply:
      channel:
        $ref: '#/channels/lobbyJoinReplies'
      messages:
        - $ref: '#/channels/lobbyJoinReplies/messages/result'
      x-socketio:
        acknowledgement: true

  handleLeaveLobby:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/leaveLobby'
    reply:
      channel:
        $ref: '#/channels/lobbyLeaveReplies'
      messages:
        - $ref: '#/channels/lobbyLeaveReplies/messages/result'
      x-socketio:
        acknowledgement: true

  broadcastLobbyDirectory:
    action: send
    channel:
      $ref: '#/channels/lobbyDirectory'

  broadcastLobbyEvents:
    action: send
    channel:
      $ref: '#/channels/lobby'

  handleJoinGame:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/joinGame'
    reply:
      channel:
        $ref: '#/channels/joinReplies'
      messages:
        - $ref: '#/channels/joinReplies/messages/result'
      x-socketio:
        acknowledgement: true

  receiveProgram:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/submitProgram'
    reply:
      channel:
        $ref: '#/channels/programReplies'
      messages:
        - $ref: '#/channels/programReplies/messages/programResult'
      x-socketio:
        acknowledgement: true

  sendPrivateEvents:
    action: send
    channel:
      $ref: '#/channels/player'

  broadcastGameEvents:
    action: send
    channel:
      $ref: '#/channels/public'

  handleGetGameState:
    action: receive
    channel:
      $ref: '#/channels/commands'
    messages:
      - $ref: '#/channels/commands/messages/getPublicGameState'
    reply:
      channel:
        $ref: '#/channels/publicGameStateReplies'
      messages:
        - $ref: '#/channels/publicGameStateReplies/messages/publicGameStateResult'
      x-socketio:
        acknowledgement: true

components:
  messages:

    Login:
      name: user.login
      description: Requests a user identity for a username.
      payload:
        $ref: '#/components/schemas/Login'

      examples:
        - name: "username"
          summary: "Exact username, no normalization"
          payload:
            username: "Dane"

    LoginResult:
      name: user.loginResult
      description: Returns an approved user identity or a rejection.
      payload:
        $ref: '#/components/schemas/LoginResult'

      examples:
        - name: "loggedIn"
          summary: "Same shape for new and existing users"
          payload:
            outcome: "LOGGED_IN"
            user:
              userId: "00000000-0000-4000-8000-000000000004"
              username: "Dane"
        - name: "invalidUsername"
          summary: "Empty or overlong username"
          payload:
            outcome: "INVALID_USERNAME"

