version: "0.5"

processes:
  reset-rauthy-db:
    command: "rm -rf rauthy/data"

  rauthy:
    command: "rauthy serve -c infra/rauthy/config.toml"
    environment:
      - "BOOTSTRAP_DIR=infra/rauthy/bootstrap"
    depends_on:
      reset-rauthy-db:
        condition: process_completed_successfully

  apply-rauthy-theme:
    command: "bash infra/rauthy/apply-theme.sh"
    depends_on:
      rauthy:
        condition: process_started

  build-game-events:
    command: "pnpm --filter @robo-rally/game-events run build"

  client:
    command: "pnpm --filter @robo-rally/client run dev"
    depends_on:
      build-game-events:
        condition: process_completed_successfully

  game-service:
    command: "pnpm --filter @robo-rally/game-service run dev"
    depends_on:
      build-game-events:
        condition: process_completed_successfully
