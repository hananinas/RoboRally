version: "0.5"

processes:
  reset-kratos-db:
    command: "rm -rf kratos/data && mkdir -p kratos/data"

  migrate-kratos-db:
    command: "kratos -c infra/kratos/kratos.yml migrate sql -e --yes"
    depends_on:
      reset-kratos-db:
        condition: process_completed_successfully

  mailpit:
    command: "mailpit"

  kratos:
    command: "kratos serve -c infra/kratos/kratos.yml --dev --watch-courier"
    depends_on:
      migrate-kratos-db:
        condition: process_completed_successfully
      mailpit:
        condition: process_started

  reset-hydra-db:
    command: "rm -rf hydra/data && mkdir -p hydra/data"

  migrate-hydra-db:
    command: "hydra migrate -c infra/hydra/hydra.yml sql up -e --yes"
    depends_on:
      reset-hydra-db:
        condition: process_completed_successfully

  generate-dev-tls-cert:
    command: >
      mkdir -p infra/dev-tls &&
      mkcert -install &&
      mkcert -cert-file infra/dev-tls/cert.pem -key-file infra/dev-tls/key.pem 127.0.0.1 localhost

  hydra:
    command: "hydra serve -c infra/hydra/hydra.yml all --dev"
    depends_on:
      migrate-hydra-db:
        condition: process_completed_successfully
      generate-dev-tls-cert:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "curl --fail --silent --max-time 2 http://127.0.0.1:4445/health/ready"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 15

  kratos-hydra-ui:
    command: "pnpm --filter @robo-rally/kratos-hydra-ui run start"
    depends_on:
      kratos:
        condition: process_started
      hydra:
        condition: process_started

  register-game-service-client:
    command: >
      curl --fail --silent --show-error
      -X POST http://127.0.0.1:4445/admin/clients
      -H "Content-Type: application/json"
      -d @infra/hydra/clients/game-service.json
    depends_on:
      hydra:
        condition: process_healthy

  build-game-events:
    command: "pnpm --filter @robo-rally/game-events run build"

  dev-tls-proxy:
    command: "caddy run --config infra/Caddyfile.dev --adapter caddyfile"
    depends_on:
      generate-dev-tls-cert:
        condition: process_completed_successfully

  client:
    command: "pnpm --filter @robo-rally/client run dev"
    depends_on:
      build-game-events:
        condition: process_completed_successfully

  game-service:
    command: >
      export PORT=3002 &&
      export NODE_EXTRA_CA_CERTS="$(mkcert -CAROOT)/rootCA.pem" &&
      pnpm --filter @robo-rally/game-service run dev
    depends_on:
      build-game-events:
        condition: process_completed_successfully
      register-game-service-client:
        condition: process_completed_successfully
      generate-dev-tls-cert:
        condition: process_completed_successfully
