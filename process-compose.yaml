version: "0.5"

processes:
  reset-kratos-db:
    command: "rm -rf kratos/data && mkdir -p kratos/data"

  migrate-kratos-db:
    command: "kratos -c infra/kratos/kratos.yml migrate sql -e --yes"
    depends_on:
      reset-kratos-db:
        condition: process_completed_successfully

  mailpit:
    command: "mailpit"

  kratos:
    command: "kratos serve -c infra/kratos/kratos.yml --dev --watch-courier"
    depends_on:
      migrate-kratos-db:
        condition: process_completed_successfully
      mailpit:
        condition: process_started
    readiness_probe:
      exec:
        command: "curl --fail --silent --max-time 2 http://127.0.0.1:4434/health/ready"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 15

  seed-kratos-identities:
    command: "kratos import identities infra/kratos/fixtures/dev-users.json -e http://127.0.0.1:4434"
    depends_on:
      kratos:
        condition: process_healthy

  reset-hydra-db:
    command: "rm -rf hydra/data && mkdir -p hydra/data"

  migrate-hydra-db:
    command: "hydra migrate -c infra/hydra/hydra.yml sql up -e --yes"
    depends_on:
      reset-hydra-db:
        condition: process_completed_successfully

  generate-dev-tls-cert:
    command: >
      mkdir -p infra/dev-tls &&
      TRUST_STORES=nss mkcert -install &&
      mkcert -cert-file infra/dev-tls/cert.pem -key-file infra/dev-tls/key.pem 127.0.0.1 localhost

  hydra:
    command: "TTL_REFRESH_TOKEN=${REFRESH_TOKEN_TTL_SECONDS:-86400}s hydra serve -c infra/hydra/hydra.yml all --dev"
    depends_on:
      migrate-hydra-db:
        condition: process_completed_successfully
      generate-dev-tls-cert:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "curl --fail --silent --max-time 2 http://127.0.0.1:4445/health/ready"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 15

  kratos-hydra-ui:
    command: >
      export NODE_EXTRA_CA_CERTS="$(mkcert -CAROOT)/rootCA.pem" &&
      pnpm --filter @robo-rally/kratos-hydra-ui run start
    environment:
      - TRUSTED_CLIENT_IDS=game-service
    depends_on:
      kratos:
        condition: process_healthy
      hydra:
        condition: process_healthy
      dev-tls-proxy:
        condition: process_healthy
    readiness_probe:
      exec:
        command: >
          curl --silent --max-time 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:14455/
          | grep -qE "^[1-9][0-9]{2}$"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 15

  register-game-service-client:
    command: >
      curl --fail --silent --show-error
      -X POST http://127.0.0.1:4445/admin/clients
      -H "Content-Type: application/json"
      -d @infra/hydra/clients/game-service.json
    depends_on:
      hydra:
        condition: process_healthy

  build-game-events:
    command: "pnpm --filter @robo-rally/game-events run build"

  dev-tls-proxy:
    command: "caddy run --config infra/Caddyfile.dev --adapter caddyfile"
    depends_on:
      generate-dev-tls-cert:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        # Any status counts: only confirms Caddy itself is up, not the proxied backend.
        command: >
          curl --silent --max-time 2 --insecure -o /dev/null -w "%{http_code}" https://127.0.0.1:3001
          | grep -qE "^[1-9][0-9]{2}$"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 30

  open-client:
    namespace: dev-ui
    command: >
      if [ -n "$WSL_DISTRO_NAME" ]; then
        firefox https://127.0.0.1:3001
      else
        xdg-open https://127.0.0.1:3001
      fi
    depends_on:
      dev-tls-proxy:
        condition: process_healthy
      client:
        condition: process_started

  client:
    command: "pnpm --filter @robo-rally/client run dev"
    depends_on:
      build-game-events:
        condition: process_completed_successfully
      kratos:
        condition: process_healthy
      hydra:
        condition: process_healthy
      kratos-hydra-ui:
        condition: process_healthy

  migrate-game-db:
    namespace: game
    command: "pnpm --filter @robo-rally/game-service run migrate"

  game-service:
    namespace: game
    command: >
      export PORT=3002 &&
      export NODE_EXTRA_CA_CERTS="$(mkcert -CAROOT)/rootCA.pem" &&
      pnpm --filter @robo-rally/game-service run dev
    depends_on:
      build-game-events:
        condition: process_completed_successfully
      register-game-service-client:
        condition: process_completed_successfully
      generate-dev-tls-cert:
        condition: process_completed_successfully
      migrate-game-db:
        condition: process_completed_successfully
